<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Asesino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#151519;
    --panel-2:#1d1d22;
    --gold:#c9a24b;
    --gold-dim:#8a7238;
    --blood:#8c1f28;
    --grey-dead:#55555a;
    --text:#eae7df;
    --text-dim:#9a978f;
    --border:#2a2a30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.03em;
    font-weight:400;
    margin:0;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:20px 18px 40px;}
  .wide #app{max-width:900px;}
  .top{ text-align:center; margin-bottom:22px;}
  .top h1{font-size:2.6rem; color:var(--gold);}
  .top p{color:var(--text-dim); margin-top:2px; font-size:0.9rem;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:22px; margin-bottom:14px;
  }
  .btn{
    display:block; width:100%; padding:14px 16px; border-radius:5px; border:none;
    font-family:'Work Sans',sans-serif; font-weight:600; font-size:1rem; cursor:pointer;
    margin-top:10px; text-align:center; text-decoration:none;
  }
  .btn-gold{ background:var(--gold); color:#1a1305;}
  .btn-gold:hover{ background:#d9b360;}
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold);}
  .btn-blood{ background:var(--blood); color:#f4e6e6;}
  .btn:disabled{ opacity:0.4; cursor:not-allowed;}
  label{ display:block; font-size:0.85rem; color:var(--text-dim); margin:14px 0 6px;}
  input[type=text],input[type=password],input[type=tel]{
    width:100%; padding:12px; border-radius:5px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:1rem; font-family:inherit;
  }
  input:focus{ outline:none; border-color:var(--gold);}
  .avatar{
    width:100%; aspect-ratio:1/1; border-radius:50%; object-fit:cover;
    border:3px solid var(--gold); display:block; margin:0 auto;
  }
  .avatar.dead{ filter:grayscale(1) brightness(0.55); border-color:var(--grey-dead);}
  .avatar-wrap{ position:relative; width:150px; margin:0 auto 14px;}
  .skull{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:2.6rem; opacity:0; pointer-events:none;
  }
  .avatar-wrap.dead .skull{ opacity:0.9; }
  .name{ text-align:center; font-size:1.5rem; margin-top:6px;}
  .name.dead{ color:var(--grey-dead); text-decoration:line-through; text-decoration-color:var(--blood);}
  .tag{ text-align:center; color:var(--text-dim); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em;}
  .mission-box{
    background:var(--panel-2); border-left:3px solid var(--gold); padding:14px 16px;
    border-radius:4px; margin:16px 0; font-size:1.1rem; line-height:1.4;
  }
  .lobby-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px;}
  .lobby-item{ text-align:center;}
  .lobby-item img{ width:100%; aspect-ratio:1/1; border-radius:50%; object-fit:cover; border:2px solid var(--gold);}
  .lobby-item .lname{ font-size:0.78rem; margin-top:4px; color:var(--text-dim); word-break:break-word;}
  .spectator-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px;}
  .wide .spectator-grid{ grid-template-columns:repeat(6,1fr);}
  .spec-item{ text-align:center; transition:opacity .3s;}
  .spec-item.dead{ opacity:0.42;}
  .spec-item img{ width:100%; aspect-ratio:1/1; border-radius:8px; object-fit:cover; border:2px solid var(--gold);}
  .spec-item.dead img{ filter:grayscale(1) brightness(0.5); border-color:var(--grey-dead);}
  .spec-item .sname{ font-size:0.85rem; margin-top:6px;}
  .counter{ text-align:center; margin:20px 0;}
  .counter .big{ font-family:'Bebas Neue'; font-size:4rem; color:var(--gold); line-height:1;}
  .counter .sub{ color:var(--text-dim);}
  .toggle-row{ display:flex; gap:8px; margin-bottom:10px;}
  .toggle-row button{ flex:1;}
  .toggle-row button.active{ background:var(--gold); color:#1a1305; border-color:var(--gold);}
  .row{ display:flex; gap:10px;}
  .row .btn{ flex:1;}
  .code-box{
    text-align:center; font-family:'Bebas Neue'; font-size:2.4rem; letter-spacing:0.15em;
    color:var(--gold); background:var(--panel-2); border:1px dashed var(--gold-dim);
    padding:14px; border-radius:6px; margin:14px 0;
  }
  .qr{ display:block; margin:16px auto; border-radius:6px; background:#fff; padding:8px;}
  .small-link{ text-align:center; word-break:break-all; color:var(--text-dim); font-size:0.8rem;}
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal{ background:var(--panel); border:1px solid var(--gold-dim); border-radius:8px; padding:24px; max-width:340px; width:100%;}
  .ranking-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .ranking-row img{ width:42px; height:42px; border-radius:50%; object-fit:cover;}
  .ranking-row .rn{ flex:1;}
  .ranking-row .rv{ color:var(--gold); font-weight:600;}
  .badge{ background:var(--panel-2); border:1px solid var(--gold-dim); border-radius:6px; padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:center;}
  .badge img{ width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid var(--gold);}
  .badge .bt{ font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim);}
  .badge .bn{ font-size:1.15rem;}
  .err{ color:#e07a7a; font-size:0.85rem; margin-top:6px;}
  .center{ text-align:center;}
  .footer-nav{ margin-top:auto; text-align:center; padding-top:24px;}
  .footer-nav a{ color:var(--text-dim); font-size:0.8rem; cursor:pointer; text-decoration:underline;}
  .hint{ color:var(--text-dim); font-size:0.8rem; margin-top:4px;}
  .photo-btn{
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--gold-dim);
    color:var(--gold); font-family:'Bebas Neue',sans-serif; letter-spacing:0.05em; font-size:1.05rem;
  }
  .photo-btn:hover{ border-color:var(--gold);}
  .info-icon{ cursor:pointer; color:var(--gold); font-style:normal; margin-left:4px;}
  .step-indicator{ text-align:center; color:var(--text-dim); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; margin-top:16px;}
  .slide-nav{ display:flex; gap:10px; margin-top:6px;}
  .slide-nav .btn{ flex:1;}
  .star-name{ color:var(--gold); font-weight:700;}
  .avatar-wrap.epic{ width:210px;}
  .epic-copy{ font-size:1rem; margin-top:10px; line-height:1.4;}
  .mission-photo{ width:100%; max-width:260px; aspect-ratio:3/4; margin:0 auto 16px; display:block;}
  .mission-photo img{
    width:100%; height:100%; object-fit:cover; display:block;
    clip-path: polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%);
    filter: drop-shadow(0 0 14px rgba(201,162,75,0.55));
  }
  .avatar.kite{ border:none; clip-path: polygon(50% 0%, 100% 40%, 50% 100%, 0% 40%);}
  .avatar.dead.kite{ filter: grayscale(1) brightness(0.5) drop-shadow(0 0 10px rgba(85,85,90,0.6));}
  .clickable-hint{ cursor:pointer;}
  .code-pill{
    position:sticky; top:0; text-align:center; font-size:0.7rem; letter-spacing:0.08em;
    color:var(--gold); background:var(--panel-2); border:1px solid var(--border); border-radius:20px;
    padding:4px 14px; width:fit-content; margin:0 auto 14px; text-transform:uppercase; z-index:10;
  }
  @media (max-width: 360px){
    .lobby-grid, .spectator-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @keyframes revealPop{ from{ opacity:0; transform:scale(0.85);} to{ opacity:1; transform:scale(1);} }
  .mission-photo.reveal img{ animation: revealPop 0.55s ease-out; }
  @keyframes fadeToGray{ from{ filter:none; opacity:0.4;} to{ filter:grayscale(1) brightness(0.5) drop-shadow(0 0 10px rgba(85,85,90,0.6)); opacity:1;} }
  .reveal-dead{ animation: fadeToGray 1.2s ease forwards; }
  @keyframes slideIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  .slide-enter{ animation: slideIn 0.4s ease-out; }
  @keyframes confettiFall{
    0%{ transform:translateY(-20px) rotate(0deg); opacity:1;}
    100%{ transform:translateY(220px) rotate(360deg); opacity:0;}
  }
  .confetti-wrap{ position:relative; height:0;}
  .confetti-piece{
    position:absolute; top:-10px; width:8px; height:14px; opacity:0.9;
    animation: confettiFall 2.2s ease-in forwards;
  }
  .stars-row{ display:flex; gap:8px; justify-content:center; margin:12px 0;}
  .star-btn{ font-size:2rem; cursor:pointer; color:var(--border); transition:color .15s, transform .15s;}
  .star-btn.filled{ color:var(--gold); transform:scale(1.1);}
  .winner-stage{
    position:relative; width:100%; max-width:280px; aspect-ratio:1/1;
    margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
  }
  .winner-bg{ position:absolute; inset:0; overflow:hidden; border-radius:14px;}
  .bg-thumb{
    position:absolute; width:15%; aspect-ratio:1/1; border-radius:6px; object-fit:cover;
    filter:grayscale(1) brightness(0.38); opacity:0.6;
  }
  .winner-photo{
    position:relative; width:66%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    border:4px solid var(--gold); box-shadow:0 0 34px rgba(201,162,75,0.55); z-index:2;
  }
  .winner-photo img{ width:100%; height:100%; object-fit:cover; display:block;}
  .final-name{ text-align:center; font-family:'Bebas Neue',sans-serif; font-size:2.5rem; color:var(--gold); letter-spacing:0.03em; margin-top:4px;}
  .final-label{ text-align:center; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.18em; font-size:0.72rem; margin-bottom:6px;}
  .rank-pos{ font-family:'Bebas Neue',sans-serif; font-size:1.2rem; color:var(--text-dim); width:26px; text-align:center; flex-shrink:0;}
  .tag-labels{ display:flex; flex-wrap:wrap; gap:4px; margin-top:2px;}
  .tag-pill{ font-size:0.65rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold); border:1px solid var(--gold-dim); border-radius:10px; padding:1px 7px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ==== CONFIGURA ESTO ANTES DE SUBIR EL ARCHIVO ====
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyzHw8TNeC9-h9w2Noe4vEgfX6BeeFlzyj_0POYrOA_mVruieTDiGmL904VoDj4CV-i/exec", // termina en /exec
  SECRET_KEY: "RGA1985",                 // la misma que pusiste en Code.gs
  BASE_URL: ""  // ej: "https://tuweb.com/juegos/el-asesino.html" — la URL donde subas este archivo
};
// ===================================================

// ---------- sonidos (sintetizados, sin ficheros externos) ----------
function playTone(freq, duration, type, vol){
  try{
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext||window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.value = vol || 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }catch(e){ /* audio no disponible, seguimos sin sonido */ }
}
function sfxKill(){ playTone(180,0.15,'square',0.2); setTimeout(()=>playTone(120,0.15,'square',0.2),90); }
function sfxReassign(){ playTone(300,0.12,'sine',0.15); setTimeout(()=>playTone(220,0.12,'sine',0.15),100); setTimeout(()=>playTone(500,0.18,'sine',0.15),200); }
function sfxFanfare(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,0.28,'triangle',0.18), i*140)); }
document.addEventListener('click', function primeAudio(){
  try{ (window._audioCtx || (window._audioCtx = new (window.AudioContext||window.webkitAudioContext)())).resume(); }catch(e){}
  document.removeEventListener('click', primeAudio);
}, { once:true });

const state = {
  screen: 'home',
  code: null,
  role: null,        // 'player' | 'admin' | 'spectator'
  myPlayerId: null,
  adminParticipaFlag: false,
  spectatorMode: 'anon', // 'anon' | 'full'
  photoData: null,
  error: null,
  pollTimer: null
};

// ---------- utilidades ----------
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)); }
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function derangement(ids){
  if(ids.length<2) return ids.slice();
  let perm, tries=0;
  do{
    perm = shuffle(ids);
    tries++;
    if(tries>500) break;
  } while(perm.some((v,i)=>v===ids[i]));
  return perm;
}
function resizeImage(file, maxSize=220){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
        else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function loadGame(code){
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?code=${encodeURIComponent(code)}&key=${encodeURIComponent(CONFIG.SECRET_KEY)}`;
    const res = await fetch(url);
    const json = await res.json();
    if(json.error){ console.error('Error backend:', json.error); return null; }
    return json.found ? JSON.parse(json.data) : null;
  }catch(e){ console.error(e); return null; }
}
async function ensurePhotos(g){
  if(!g || !g.jugadores) return;
  state.photoCache = state.photoCache || {};
  const missing = g.jugadores.map(j=>j.id).filter(id=>!(id in state.photoCache));
  if(missing.length===0) return;
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=fotos&code=${encodeURIComponent(state.code)}&ids=${encodeURIComponent(missing.join(','))}&key=${encodeURIComponent(CONFIG.SECRET_KEY)}`;
    const res = await fetch(url);
    const json = await res.json();
    if(json.fotos){ Object.assign(state.photoCache, json.fotos); render(); }
  }catch(e){ console.error(e); }
}
function photoOf(id){ return (state.photoCache && state.photoCache[id]) || null; }
async function saveGame(code, obj){
  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita el preflight CORS que Apps Script no soporta
      body: JSON.stringify({ key: CONFIG.SECRET_KEY, code, data: JSON.stringify(obj) })
    });
    const json = await res.json();
    return !!json.ok;
  }catch(e){ console.error(e); return false; }
}
async function callAction(action, payload){
  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ key: CONFIG.SECRET_KEY, action }, payload))
    });
    const json = await res.json();
    if(json.error) return { ok:false, error: json.error };
    return { ok:true, data: json.data ? JSON.parse(json.data) : null, jugadorId: json.jugadorId };
  }catch(e){ console.error(e); return { ok:false, error:'red' }; }
}
async function saveJoin(code, jugador){ return callAction('join', { code, jugador }); }
function saveSession(){
  try{
    localStorage.setItem('elasesino-session', JSON.stringify({
      code: state.code, myPlayerId: state.myPlayerId, role: state.role
    }));
  }catch(e){ /* almacenamiento no disponible, no pasa nada grave */ }
}
function loadSession(){
  try{ return JSON.parse(localStorage.getItem('elasesino-session') || 'null'); }
  catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem('elasesino-session'); }catch(e){}
}
function shareUrlFor(code){
  const base = CONFIG.BASE_URL || location.href.split('?')[0];
  return base + '?p=' + code;
}
function shareSpectatorUrlFor(code){
  const base = CONFIG.BASE_URL || location.href.split('?')[0];
  return base + '?e=' + code;
}
function trySetSpectatorFull(){
  if(state._game && state._game.modoEspectador==='completo'){ state.spectatorMode='full'; render(); }
}
function copyLink(url){
  navigator.clipboard.writeText(url).then(()=>alert('Enlace copiado')).catch(()=>alert(url));
}

// ---------- transiciones de estado tras poll ----------
async function pollTick(){
  if(!state.code) return;
  if(state.screen==='join' || state.showKillModal) return; // no interrumpir mientras el usuario está escribiendo
  const g = await loadGame(state.code);
  if(!g) return;
  state._game = g;
  ensurePhotos(g);
  if(state.role==='player'){
    const me = g.jugadores.find(j=>j.id===state.myPlayerId);
    if(me){
      if(g.estado==='finalizada'){
        if(state.screen!=='ranking') sfxFanfare();
        state.screen='ranking';
        if(state.pollTimer) clearInterval(state.pollTimer);
      }
      else if(me.estado==='muerto'){ if(state.screen!=='dead') state.screen='dead'; }
      else if(g.estado==='en_curso' && state.screen==='lobby'){ state.screen='game'; }
      else if(g.estado==='en_curso' && g.ultimaReasignacion && g.ultimaReasignacion!==state.lastReassignSeen){
        state.lastReassignSeen = g.ultimaReasignacion;
        if(state.screen==='game'){ state.showReassignModal = true; sfxReassign(); }
      }
    }
  } else if(state.role==='admin'){
    if(g.estado==='finalizada'){
      if(state.screen!=='ranking') sfxFanfare();
      state.screen='ranking';
      if(state.pollTimer) clearInterval(state.pollTimer);
    }
    else if(g.estado==='en_curso' && state.screen==='lobby'){ state.screen='admin-panel'; }
  } else if(state.role==='spectator'){
    // sin transición automática de pantalla
  }
  render();
}
function startPolling(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(pollTick, 2500);
}

// ---------- acciones ----------
async function actionCreateGame(participa, modoEspectador){
  let code = genCode();
  for(let i=0;i<5;i++){
    const existente = await loadGame(code);
    if(!existente) break;
    code = genCode();
  }
  const g = {
    code, estado:'inscripcion', adminParticipa: participa, modoEspectador: modoEspectador || 'anon',
    creadoEn: Date.now(), iniciadoEn:null, jugadores: [], ultimaReasignacion:null
  };
  const ok = await saveGame(code, g);
  if(!ok){ state.error='No se ha podido crear la partida. Revisa tu conexión e inténtalo de nuevo.'; render(); return; }
  state.code = code;
  state.adminParticipaFlag = participa;
  state.error = null;
  state._game = g;
  state.role = participa ? 'player' : 'admin';
  if(participa) state._pendingAdminJoin = true;
  else saveSession();
  state.screen = 'created';
  startPolling();
  render();
}

async function actionGoJoinExisting(){
  const code = document.getElementById('join-code-input').value.trim().toUpperCase();
  if(!code){ state.error='Introduce un código.'; render(); return; }
  const g = await loadGame(code);
  if(!g){ state.error='No existe ninguna partida con ese código.'; render(); return; }
  if(g.estado!=='inscripcion'){ state.error='Esta partida ya ha empezado y no admite nuevos jugadores.'; render(); return; }
  state.code = code; state.error=null; state.role='player'; state.screen='join';
  startPolling();
  render();
}

async function actionSubmitJoin(){
  const nombre = document.getElementById('j-nombre').value.trim();
  const accion = document.getElementById('j-accion').value.trim();
  const pin = document.getElementById('j-pin').value.trim();
  if(!nombre || !accion || !/^\d{4}$/.test(pin)){
    state.error='Rellena nombre, acción, y un PIN de exactamente 4 números.';
    render(); return;
  }
  state.error=null;
  state.joining=true;
  render();
  const jugador = {
    id: uid(), nombre, foto: state.photoData || null, accion, pin,
    objetivoId:null, accionAsignada:null, estado:'vivo', numVictimas:0,
    ordenEliminacion:null, tsPrimeraMuerte:null, esAdmin: !!state._pendingAdminJoin, victimasLog:[]
  };
  const result = await saveJoin(state.code, jugador);
  state.joining=false;
  if(!result.ok){
    if(result.error==='no existe la partida') state.error='Esta partida ya no existe. Vuelve atrás y prueba con otro código.';
    else if(result.error==='partida ya iniciada') state.error='Esta partida ya ha empezado, no admite más jugadores.';
    else state.error='No se ha podido guardar. Revisa tu conexión e inténtalo de nuevo.';
    render(); return;
  }
  state._game = result.data;
  state.myPlayerId = jugador.id;
  state.error=null;
  saveSession();
  state.screen='lobby';
  render();
  ensurePhotos(result.data);
  pollTick();
}

function handlePhotoInput(input){
  const file = input.files[0];
  if(!file) return;
  resizeImage(file).then(data=>{
    state.photoData = data;
    const prev = document.getElementById('photo-preview');
    if(prev) prev.src = data;
  });
}

async function actionStartGame(){
  const result = await callAction('start', { code: state.code });
  if(!result.ok){
    state.error = result.error==='jugadores insuficientes' ? 'Necesitas al menos 4 jugadores.' : 'No se ha podido iniciar. Inténtalo de nuevo.';
    render(); return;
  }
  state.error=null;
  state._game = result.data;
  state.lastReassignSeen = result.data.ultimaReasignacion || null;
  state.screen = state.role==='admin' ? 'admin-panel' : 'game';
  render();
  ensurePhotos(result.data);
}

async function actionConfirmKill(){
  const pinInput = document.getElementById('kill-pin').value.trim();
  const result = await callAction('kill', { code: state.code, killerId: state.myPlayerId, pin: pinInput });
  if(!result.ok){
    state.modalError = result.error==='pin incorrecto' ? 'PIN incorrecto.' :
                        result.error==='objetivo no disponible' ? 'Ese objetivo ya no está disponible.' :
                        'No se ha podido confirmar. Inténtalo de nuevo.';
    render(); return;
  }
  state._game = result.data;
  state.showKillModal=false; state.modalError=null;
  sfxKill();
  if(result.data.estado==='finalizada'){
    state.screen='ranking';
    sfxFanfare();
    if(state.pollTimer) clearInterval(state.pollTimer);
  } else {
    state.screen='game';
  }
  render();
  ensurePhotos(result.data);
}

async function actionReassignAll(){
  const result = await callAction('reassign', { code: state.code });
  if(!result.ok){
    state.error = result.error==='vivos insuficientes' ? 'Necesitas al menos 3 jugadores vivos para reasignar.' : 'No se ha podido reasignar. Inténtalo de nuevo.';
    render(); return;
  }
  state.error=null;
  state._game = result.data;
  render();
}

async function actionToggleEspectadorMode(){
  const orden = ['nada','anon','completo'];
  const actual = orden.indexOf(state._game.modoEspectador);
  const nuevo = orden[(actual+1) % orden.length];
  const result = await callAction('setmode', { code: state.code, modo: nuevo });
  if(result.ok){ state._game = result.data; render(); }
}

async function actionOpenSpectator(){
  const code = document.getElementById('spec-code-input').value.trim().toUpperCase();
  if(!code){ state.error='Introduce el código de la partida.'; render(); return; }
  const g = await loadGame(code);
  if(!g){ state.error='No existe ninguna partida con ese código.'; render(); return; }
  state.code=code; state.role='spectator'; state.error=null; state.screen='spectator';
  state._game = g;
  saveSession();
  startPolling(); pollTick();
  ensurePhotos(g);
}

async function actionRecoverSubmit(){
  const code = document.getElementById('rec-code').value.trim().toUpperCase();
  const nombre = document.getElementById('rec-nombre').value.trim();
  const pin = document.getElementById('rec-pin').value.trim();
  if(!code || !nombre || !pin){ state.error='Rellena código, nombre y PIN.'; render(); return; }
  state.recovering=true; state.error=null; render();
  const result = await callAction('recover', { code, nombre, pin });
  state.recovering=false;
  if(!result.ok){
    state.error = result.error==='no existe la partida' ? 'No existe ninguna partida con ese código.' : 'No hemos encontrado ningún jugador con ese nombre y PIN en esa partida.';
    render(); return;
  }
  state.code = code;
  state.role = 'player';
  state.myPlayerId = result.jugadorId;
  state._game = result.data;
  state.lastReassignSeen = result.data.ultimaReasignacion || null;
  saveSession();
  const pantalla = await screenForGameState(result.data, 'player', result.jugadorId);
  state.screen = pantalla || 'lobby';
  if(state.screen!=='ranking') startPolling();
  render();
  ensurePhotos(result.data);
}

function revealMyPin(){
  state.showMyPin = true;
  render();
  setTimeout(()=>{ state.showMyPin=false; render(); }, 2500);
}

function goHome(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  clearSession();
  Object.assign(state, {screen:'home', code:null, role:null, myPlayerId:null, error:null, photoData:null, _pendingAdminJoin:false, rankingSlide:0, showMyPin:false, showAccionHint:false, _lastTargetId:null, _deadAnimated:false, ratingSubmitted:false, ratingValue:0});
  render();
}

// ---------- render ----------
function formatElapsed(ms){
  if(!ms || ms<0) ms=0;
  const totalMin = Math.floor(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  return (h>0? h+'h ':'') + m+'min';
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function avatarSrc(foto){ return foto || 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%231d1d22"/></svg>'); }

          <div class="sub">supervivientes en juego</div>
        </div>` : `
        <div class="spectator-grid">
          ${g.jugadores.map(j=>`
            <div class="spec-item ${j.estado==='muerto'?'dead':''}">
              <img src="${avatarSrc(photoOf(j.id))}">
              <div class="sname">${esc(j.nombre)}</div>
            </div>`).join('')}
        </div>`}
      <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
    }
  }

  else if(state.screen==='ranking'){
    const g = state._game;
    const superviviente = g.jugadores.find(j=>j.estado==='vivo');
    const conKills = g.jugadores.filter(j=>j.numVictimas>0);
    const veloz = conKills.length ? conKills.slice().sort((a,b)=>a.tsPrimeraMuerte-b.tsPrimeraMuerte)[0] : null;
    const maxVictimas = conKills.length ? Math.max(...conKills.map(j=>j.numVictimas)) : 0;
    const serie = maxVictimas>0 ? conKills.find(j=>j.numVictimas===maxVictimas) : null;
    const eliminados = g.jugadores.filter(j=>j.estado==='muerto').sort((a,b)=>(b.ordenEliminacion||0)-(a.ordenEliminacion||0));
    const tabla = superviviente ? [superviviente, ...eliminados] : eliminados;
    function tagsFor(j){
      const t=[];
      if(superviviente && j.id===superviviente.id) t.push('Superviviente');
      if(veloz && j.id===veloz.id) t.push('Más veloz');
      if(serie && j.id===serie.id) t.push('Asesino en serie');
      return t;
    }
    function scatterStyle(i, total){
      const cols = 5;
      const rows = Math.ceil(total/cols) || 1;
      const row = Math.floor(i/cols), col = i%cols;
      const left = (col/(cols-1||1))*82 + (Math.sin(i*13)*4);
      const top = (row/(rows-1||1))*82 + (Math.cos(i*7)*4);
      const rot = ((i*37)%40)-20;
      return `top:${top}%; left:${left}%; transform:rotate(${rot}deg);`;
    }
    const slide = state.rankingSlide || 0;

    if(slide===0 && superviviente){
      const confetti = Array.from({length:18}).map((_,i)=>{
        const left = Math.round(Math.random()*100);
        const delay = (Math.random()*0.6).toFixed(2);
        const colors = ['#c9a24b','#8c1f28','#eae7df','#8a7238'];
        const color = colors[i%colors.length];
        return `<div class="confetti-piece" style="left:${left}%; background:${color}; animation-delay:${delay}s;"></div>`;
      }).join('');
      const bgThumbs = eliminados.map((j,i)=>`<img class="bg-thumb" src="${avatarSrc(photoOf(j.id))}" style="${scatterStyle(i, eliminados.length)}">`).join('');
      html = `
        <div class="top"><h1>ÚLTIMO SUPERVIVIENTE</h1></div>
        <div class="confetti-wrap">${confetti}</div>
        <div class="card center slide-enter">
          <div class="winner-stage">
            <div class="winner-bg">${bgThumbs}</div>
            <div class="winner-photo"><img src="${avatarSrc(photoOf(superviviente.id))}"></div>
          </div>
          <div class="final-label">Ha sobrevivido a los demás</div>
          <div class="final-name">${esc(superviviente.nombre)}</div>
          <p class="epic-copy hint">Todos los que ves detrás cayeron por el camino. Solo queda en pie quien tuvo más cabeza — o más suerte.</p>
        </div>
        <div class="step-indicator">Paso 1 de 4</div>
        <div class="slide-nav"><button class="btn btn-gold" onclick="rankingNav(1)">Siguiente →</button></div>
        <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
    } else if(slide===1 && veloz){
      const minutos = formatElapsed((veloz.tsPrimeraMuerte||0) - (g.iniciadoEn||0));
      html = `
        <div class="top"><h1>ASESINO MÁS VELOZ</h1></div>
        <div class="card center slide-enter">
          <div class="avatar-wrap epic"><img class="avatar" src="${avatarSrc(photoOf(veloz.id))}"></div>
          <div class="final-name" style="font-size:2.1rem;">${esc(veloz.nombre)}</div>
          <p class="epic-copy hint">Consiguió su primera víctima en solo <strong style="color:var(--gold);">${minutos}</strong>. Nadie más tuvo tiempo de reaccionar.</p>
        </div>
        <div class="step-indicator">Paso 2 de 4</div>
        <div class="slide-nav">
          <button class="btn btn-outline" onclick="rankingNav(-1)">← Anterior</button>
          <button class="btn btn-gold" onclick="rankingNav(1)">Siguiente →</button>
        </div>
        <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
    } else if(slide===2 && serie){
      html = `
        <div class="top"><h1>ASESINO EN SERIE</h1></div>
        <div class="card center slide-enter">
          <div class="avatar-wrap epic"><img class="avatar" src="${avatarSrc(photoOf(serie.id))}"></div>
          <div class="final-name" style="font-size:2.1rem;">${esc(serie.nombre)}</div>
          <p class="epic-copy hint"><strong style="color:var(--gold);">${serie.numVictimas} víctimas</strong> a su nombre. Nadie a su alrededor estaba realmente a salvo.</p>
        </div>
        <div class="step-indicator">Paso 3 de 4</div>
        <div class="slide-nav">
          <button class="btn btn-outline" onclick="rankingNav(-1)">← Anterior</button>
          <button class="btn btn-gold" onclick="rankingNav(1)">Siguiente →</button>
        </div>
        <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
    } else {
      const nombreValorador = (function(){
        if(state.role==='player'){ const me=g.jugadores.find(j=>j.id===state.myPlayerId); return me? me.nombre : 'Jugador'; }
        return 'Organizador';
      })();
      html = `
        <div class="top"><h1>CLASIFICACIÓN FINAL</h1></div>
        <div class="card slide-enter">
          ${tabla.map((j,i)=>{
            const tg = tagsFor(j);
            return `
            <div class="ranking-row">
              <div class="rank-pos">${i+1}</div>
              <img src="${avatarSrc(photoOf(j.id))}">
              <div class="rn">
                ${esc(j.nombre)}
                ${tg.length? `<div class="tag-labels">${tg.map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div>` : ''}
              </div>
              <div class="rv">${j.numVictimas} víctimas</div>
            </div>`;
          }).join('')}
        </div>
        <div class="card center">
          <p class="hint"><strong>El Asesino</strong> es un juego creado por Roberto González Arranz.<br>Gracias por jugar — espero que hayáis disfrutado cazándoos los unos a los otros.</p>
        </div>
        <div class="card center">
          ${state.ratingSubmitted ? `
            <p class="hint">¡Gracias por tu valoración!</p>
          ` : `
            <p class="hint">¿Qué te ha parecido el juego?</p>
            <div class="stars-row">
              ${[1,2,3,4,5].map(n=>`<span class="star-btn ${n<=(state.ratingValue||0)?'filled':''}" onclick="state.ratingValue=${n}; render();">★</span>`).join('')}
            </div>
            <textarea id="rating-comment" placeholder="¿Algo que mejorarías? (opcional)" style="width:100%; min-height:60px; padding:10px; border-radius:5px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:0.9rem;"></textarea>
            <button class="btn btn-gold" style="margin-top:10px;" ${state.ratingValue? '' : 'disabled'} onclick="actionSubmitRating('${esc(nombreValorador)}')">Enviar valoración</button>
          `}
        </div>
        <div class="step-indicator">Paso 4 de 4</div>
        <div class="slide-nav"><button class="btn btn-outline" onclick="rankingNav(-1)">← Anterior</button></div>
        <div class="footer-nav"><a onclick="goHome()">Volver al inicio</a></div>`;
    }
  }

  app.innerHTML = html;
}

async function actionSubmitRating(nombre){
  const comentario = document.getElementById('rating-comment').value.trim();
  state.ratingSubmitted = true; // optimista: si falla el envío no merece la pena bloquear al usuario por esto
  render();
  await callAction('valorar', { code: state.code, nombre, puntuacion: state.ratingValue, comentario });
}

function rankingNav(delta){
  state.rankingSlide = Math.max(0, Math.min(3, (state.rankingSlide||0)+delta));
  render();
}

function renderCreateConfig(){ state.screen='create-config'; state.cfgParticipa=undefined; state.cfgModoEspectador=undefined; render(); }
function actionOpenSpectatorFromInside(){
  state.role='spectator'; state.screen='spectator'; state.myPlayerId=null; render();
}

async function screenForGameState(g, role, myPlayerId){
  if(role==='spectator') return 'spectator';
  if(g.estado==='finalizada') return 'ranking';
  if(role==='player'){
    const me = g.jugadores.find(j=>j.id===myPlayerId);
    if(!me) return null;
    if(me.estado==='muerto') return 'dead';
    return g.estado==='en_curso' ? 'game' : 'lobby';
  }
  if(role==='admin'){
    return g.estado==='en_curso' ? 'admin-panel' : 'lobby';
  }
  return null;
}

(async function init(){
  const params = new URLSearchParams(location.search);
  const espectadorCode = params.get('e') ? params.get('e').toUpperCase() : null;
  const pCode = params.get('p') ? params.get('p').toUpperCase() : null;
  const session = loadSession();

  // Un enlace de espectador en la URL manda siempre sobre cualquier sesión guardada
  if(espectadorCode){
    if(!(session && session.code===espectadorCode)) clearSession();
    state.code = espectadorCode; state.role = 'spectator';
    const g = await loadGame(espectadorCode);
    if(g){ state._game=g; state.screen='spectator'; saveSession(); startPolling(); ensurePhotos(g); }
    else { state.error='No existe ninguna partida con ese código.'; }
    render();
    return;
  }

  // Un enlace de jugador en la URL manda sobre una sesión de OTRA partida distinta;
  // si coincide con tu sesión actual, se restaura tu identidad completa en esa partida.
  if(pCode){
    if(session && session.code===pCode){
      const g = await loadGame(pCode);
      if(g){
        const pantalla = await screenForGameState(g, session.role, session.myPlayerId);
        if(pantalla){
          state.code=pCode; state.role=session.role; state.myPlayerId=session.myPlayerId;
          state._game=g; state.lastReassignSeen=g.ultimaReasignacion||null; state.screen=pantalla;
          if(pantalla!=='ranking') startPolling();
          render(); ensurePhotos(g);
          return;
        }
      }
      clearSession();
    } else if(session){
      clearSession(); // era la sesión de otra partida distinta: no la mezclamos con esta nueva
    }
    state.code = pCode; state.role = 'player';
    const g = await loadGame(pCode);
    if(g && g.estado==='inscripcion'){ state.screen='join'; startPolling(); }
    else if(g){ state.error='Esta partida ya ha empezado y no admite nuevos jugadores.'; }
    else { state.error='No existe ninguna partida con ese código.'; }
    render();
    return;
  }

  // Sin ningún código en la URL: restaurar la sesión guardada, la que sea
  if(session && session.code){
    const g = await loadGame(session.code);
    if(g){
      const pantalla = await screenForGameState(g, session.role, session.myPlayerId);
      if(pantalla){
        state.code = session.code; state.role = session.role; state.myPlayerId = session.myPlayerId;
        state._game = g; state.lastReassignSeen = g.ultimaReasignacion || null; state.screen = pantalla;
        if(pantalla!=='ranking') startPolling();
        render(); ensurePhotos(g);
        return;
      }
    }
    clearSession();
  }
  render();
})();
</script>
