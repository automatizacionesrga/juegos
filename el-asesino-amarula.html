<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Juegos del Amaruler · Amarula Trip Club</title>
<meta name="theme-color" content="#120a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120a14;
    --panel:rgba(42,21,48,.66);
    --panel-2:rgba(75,37,82,.42);
    --gold:#d2a465;
    --gold-dim:#8a6a3b;
    --blood:#8c1f28;
    --grey-dead:#6a5a62;
    --text:#f3e9e4;
    --text-dim:#b7a3a8;
    --border:rgba(210,164,101,.32);
  }
  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    min-height:100dvh;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond',sans-serif;
    letter-spacing:0.03em;
    font-weight:400;
    margin:0;
  }
  #app{max-width:480px; margin:0 auto; padding:20px 18px 40px;}
  .wide #app{max-width:900px;}
  .top{ text-align:center; margin-bottom:22px;}
  .top h1{font-size:2.6rem; color:var(--gold);}
  .top p{color:var(--text-dim); margin-top:2px; font-size:0.9rem;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:22px; margin-bottom:14px;
  }
  .btn{
    display:block; width:100%; padding:14px 16px; border-radius:5px; border:none;
    font-family:'Poppins',sans-serif; font-weight:600; font-size:1rem; cursor:pointer;
    margin-top:10px; text-align:center; text-decoration:none;
  }
  .btn-gold{ background:var(--gold); color:#1a1305;}
  .btn-gold:hover{ background:#CDA266;}
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold);}
  .btn-blood{ background:var(--blood); color:#f4e6e6;}
  .btn:disabled{ opacity:0.4; cursor:not-allowed;}
  label{ display:block; font-size:0.85rem; color:var(--text-dim); margin:14px 0 6px;}
  input[type=text],input[type=password],input[type=tel]{
    width:100%; padding:12px; border-radius:5px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:1rem; font-family:inherit;
  }
  input:focus{ outline:none; border-color:var(--gold);}
  .avatar{
    width:100%; aspect-ratio:1/1; border-radius:50%; object-fit:cover;
    border:3px solid var(--gold); display:block; margin:0 auto;
  }
  .avatar.dead{ filter:grayscale(1) brightness(0.55); border-color:var(--grey-dead);}
  .avatar-wrap{ position:relative; width:150px; margin:0 auto 14px;}
  .skull{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:2.6rem; opacity:0; pointer-events:none;
  }
  .avatar-wrap.dead .skull{ opacity:0.9; }
  .name{ text-align:center; font-size:1.5rem; margin-top:6px;}
  .name.dead{ color:var(--grey-dead); text-decoration:line-through; text-decoration-color:var(--blood);}
  .tag{ text-align:center; color:var(--text-dim); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em;}
  .mission-box{
    background:var(--panel-2); border-left:3px solid var(--gold); padding:14px 16px;
    border-radius:4px; margin:16px 0; font-size:1.1rem; line-height:1.4;
  }
  .lobby-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px;}
  .lobby-item{ text-align:center;}
  .lobby-item img{ width:100%; aspect-ratio:1/1; border-radius:50%; object-fit:cover; border:2px solid var(--gold);}
  .lobby-item .lname{ font-size:0.78rem; margin-top:4px; color:var(--text-dim); word-break:break-word;}
  .spectator-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px; align-items:start;}
  @media (min-width: 700px){
    .spectator-grid{ grid-template-columns:repeat(6,1fr);}
  }
  .spec-item{ text-align:center; transition:opacity .3s;}
  .spec-item.dead{ opacity:0.42;}
  .spec-item img{ width:100%; aspect-ratio:1/1; border-radius:8px; object-fit:cover; border:2px solid var(--gold);}
  .spec-item.dead img{ filter:grayscale(1) brightness(0.5); border-color:var(--grey-dead);}
  .spec-item .sname{ font-size:0.85rem; margin-top:6px;}
  .counter{ text-align:center; margin:20px 0;}
  .counter .big{ font-family:'Cormorant Garamond'; font-size:4rem; color:var(--gold); line-height:1;}
  .counter .sub{ color:var(--text-dim);}
  .toggle-row{ display:flex; gap:8px; margin-bottom:10px;}
  .toggle-row button{ flex:1;}
  .toggle-row button.active{ background:var(--gold); color:#1a1305; border-color:var(--gold);}
  .row{ display:flex; gap:10px;}
  .row .btn{ flex:1;}
  .code-box{
    text-align:center; font-family:'Cormorant Garamond'; font-size:2.4rem; letter-spacing:0.15em;
    color:var(--gold); background:var(--panel-2); border:1px dashed var(--gold-dim);
    padding:14px; border-radius:6px; margin:14px 0;
  }
  .qr{ display:block; margin:16px auto; border-radius:6px; background:#fff; padding:8px;}
  .small-link{ text-align:center; word-break:break-all; color:var(--text-dim); font-size:0.8rem;}
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal{ background:var(--panel); border:1px solid var(--gold-dim); border-radius:8px; padding:24px; max-width:340px; width:100%;}
  .modal.wide{ max-width:760px; }
  .opt{ display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; padding:12px 14px; margin:8px 0; background:transparent; color:var(--text); border:1px solid var(--border); border-radius:8px; cursor:pointer; font:inherit; }
  .opt .mark{ flex:none; width:22px; height:22px; border-radius:50%; border:2px solid var(--border); margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:#1a0f1c; }
  .opt .t{ display:block; font-weight:600; }
  .opt .d{ display:block; font-size:0.82rem; color:var(--text-dim); margin-top:2px; line-height:1.35; }
  .opt.sel{ border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold); background:rgba(210,164,101,.12); }
  .opt.sel .mark{ background:var(--gold); border-color:var(--gold); }
  .opt:disabled{ opacity:.6; cursor:wait; }
  .ranking-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .ranking-row img{ width:42px; height:42px; border-radius:50%; object-fit:cover;}
  .ranking-row .rn{ flex:1;}
  .ranking-row .rv{ color:var(--gold); font-weight:600;}
  .badge{ background:var(--panel-2); border:1px solid var(--gold-dim); border-radius:6px; padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:center;}
  .badge img{ width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid var(--gold);}
  .badge .bt{ font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim);}
  .badge .bn{ font-size:1.15rem;}
  .err{ color:#e07a7a; font-size:0.85rem; margin-top:6px;}
  .center{ text-align:center;}
  .footer-nav{ margin-top:28px; text-align:center; padding-top:24px;}
  .footer-nav a{ color:var(--text-dim); font-size:0.8rem; cursor:pointer; text-decoration:underline;}
  .hint{ color:var(--text-dim); font-size:0.8rem; margin-top:4px;}
  .photo-btn{
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--gold-dim);
    color:var(--gold); font-family:'Poppins',sans-serif; letter-spacing:0.02em; font-size:0.9rem;
  }
  .photo-btn:hover{ border-color:var(--gold);}
  .info-icon{ cursor:pointer; color:var(--gold); font-style:normal; margin-left:4px;}
  .step-indicator{ text-align:center; color:var(--text-dim); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; margin-top:16px;}
  .slide-nav{ display:flex; gap:10px; margin-top:6px;}
  .slide-nav .btn{ flex:1;}
  .star-name{ color:var(--gold); font-weight:700;}
  .avatar-wrap.epic{ width:210px;}
  .epic-copy{ font-size:1rem; margin-top:10px; line-height:1.4;}
  .mission-photo{ width:100%; max-width:210px; aspect-ratio:1/1; margin:0 auto 16px; display:block;}
  .mission-photo img{
    width:100%; height:100%; object-fit:cover; object-position:center 20%; display:block;
    clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
    filter: drop-shadow(0 0 14px rgba(190,143,78,0.55));
  }
  .mission-photo.placeholder-oculto{
    clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
    background: linear-gradient(135deg, var(--panel-2) 0%, var(--panel) 100%);
    display:flex; align-items:center; justify-content:center;
    border:1px dashed var(--gold-dim);
    filter: drop-shadow(0 0 10px rgba(190,143,78,0.25));
  }
  .mission-photo.placeholder-oculto span{
    font-family:'Cormorant Garamond',sans-serif; font-size:3.4rem; color:var(--gold-dim);
  }
  .avatar.kite{ border:none; clip-path: polygon(50% 0%, 100% 40%, 50% 100%, 0% 40%);}
  .avatar.dead.kite{ filter: grayscale(1) brightness(0.5) drop-shadow(0 0 10px rgba(85,85,90,0.6));}
  .clickable-hint{ cursor:pointer;}
  .code-pill{
    text-align:center; font-size:0.7rem; letter-spacing:0.08em; cursor:pointer;
    color:var(--gold); background:var(--panel-2); border:1px solid var(--border); border-radius:20px;
    padding:4px 14px; width:fit-content; margin:0 auto 14px;
  }
  .code-pill .txt{ text-transform:uppercase;}
  .code-pill .hint-inline{ text-transform:none; letter-spacing:normal; color:var(--text-dim); font-size:0.72rem; margin-left:6px;}
  @media (max-width: 360px){
    .lobby-grid, .spectator-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @keyframes revealPop{ from{ opacity:0; transform:scale(0.85);} to{ opacity:1; transform:scale(1);} }
  .mission-photo.reveal img{ animation: revealPop 0.55s ease-out; }
  @keyframes fadeToGray{ from{ filter:none; opacity:0.4;} to{ filter:grayscale(1) brightness(0.5) drop-shadow(0 0 10px rgba(85,85,90,0.6)); opacity:1;} }
  .reveal-dead{ animation: fadeToGray 1.2s ease forwards; }
  @keyframes slideIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  .slide-enter{ animation: slideIn 0.4s ease-out; }
  @keyframes confettiFall{
    0%{ transform:translateY(-20px) rotate(0deg); opacity:1;}
    100%{ transform:translateY(220px) rotate(360deg); opacity:0;}
  }
  .confetti-wrap{ position:relative; height:0;}
  .confetti-piece{
    position:absolute; top:-10px; width:8px; height:14px; opacity:0.9;
    animation: confettiFall 2.2s ease-in forwards;
  }
  .stars-row{ display:flex; gap:8px; justify-content:center; margin:12px 0;}
  .star-btn{ font-size:2rem; cursor:pointer; color:var(--grey-dead); transition:color .15s, transform .15s;}
  .star-btn.filled{ color:var(--gold); transform:scale(1.1);}
  .winner-stage{
    position:relative; width:100%; max-width:280px; aspect-ratio:1/1;
    margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
  }
  .winner-bg{ position:absolute; inset:0; overflow:hidden; border-radius:14px;}
  .bg-thumb{
    position:absolute; width:15%; aspect-ratio:1/1; border-radius:6px; object-fit:cover;
    filter:grayscale(1) brightness(0.38); opacity:0.6;
  }
  .winner-photo{
    position:relative; width:66%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    border:4px solid var(--gold); box-shadow:0 0 34px rgba(190,143,78,0.55); z-index:2;
  }
  .winner-photo img{ width:100%; height:100%; object-fit:cover; display:block;}
  .final-name{ text-align:center; font-family:'Cormorant Garamond',sans-serif; font-size:2.5rem; color:var(--gold); letter-spacing:0.03em; margin-top:4px;}
  .final-label{ text-align:center; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.18em; font-size:0.72rem; margin-bottom:6px;}
  .rank-pos{ font-family:'Cormorant Garamond',sans-serif; font-size:1.2rem; color:var(--text-dim); width:26px; text-align:center; flex-shrink:0;}
  .tag-labels{ display:flex; flex-wrap:wrap; gap:4px; margin-top:2px;}
  .tag-pill{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold); border:1px solid var(--gold-dim); border-radius:10px; padding:1px 7px;}
  .time-highlight{ font-family:'Cormorant Garamond',sans-serif; font-size:3rem; color:var(--gold); letter-spacing:0.03em; margin:2px 0 8px;}
  .victims-grid{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:14px;}
  .victim-thumb{ width:44px; height:44px; border-radius:6px; object-fit:cover; filter:grayscale(1) brightness(0.55); border:1px solid var(--grey-dead);}
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (min-width: 700px){
    .stat-grid{ grid-template-columns:repeat(4,1fr);}
  }
  .stat-card{ background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:14px; text-align:center;}
  .stat-card .num{ font-family:'Cormorant Garamond',sans-serif; font-size:2.2rem; color:var(--gold);}
  .stat-card .lbl{ color:var(--text-dim); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}

  /* ---- Marca Amarula Trip Club ---- */
  body{ font-variant-numeric: lining-nums; }
  h1,h2,h3{ font-weight:700; }
  .top h1{ letter-spacing:0.06em; }
  .counter .big,.code-box,.photo-btn,.mission-photo.placeholder-oculto span,.final-name,.rank-pos,.time-highlight,.stat-card .num{ font-weight:700; }
  textarea{
    width:100%; min-height:110px; padding:12px; border-radius:5px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:1rem; font-family:inherit; resize:vertical;
  }
  textarea:focus{ outline:none; border-color:var(--gold);}
  .brand-bar{ text-align:center; margin:2px 0 16px;}
  .brand-word{ font-family:'Cormorant Garamond',serif; font-weight:700; letter-spacing:0.32em; color:var(--gold); padding-left:0.32em; line-height:1;}
  .brand-word span{ display:block; font-family:'Poppins',sans-serif; font-weight:500; font-size:0.42em; letter-spacing:0.5em; margin-top:6px; padding-left:0.5em;}

  /* ---- Imaginario "Juegos del Hambre" (inspirado en la guía visual): ciruela, oro, bronce rosado ---- */
  html{ background:#120a14; }
  body{
    background:radial-gradient(ellipse 90% 70% at 50% 30%, #4b2552 0%, #2a1530 38%, #120a14 78%) fixed;
    position:relative;
  }
  body::before{ /* viñeta */
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(8,3,10,.65) 100%);
  }
  #app{ position:relative; z-index:2; }
  #dust{ position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  #dust i{
    position:absolute; bottom:-12px; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle,#ffe3a3 0%,rgba(255,227,163,0) 70%);
    opacity:0; animation:dustUp linear infinite;
  }
  @keyframes dustUp{
    0%{ transform:translate3d(0,0,0) scale(.6); opacity:0; }
    15%{ opacity:.85; }
    100%{ transform:translate3d(var(--dx,20px),-110vh,0) scale(1.4); opacity:0; }
  }
  #flora{ position:fixed; left:50%; bottom:0; width:min(620px,110vw); transform:translateX(-50%); pointer-events:none; z-index:1; opacity:.42; }
  #app{ padding-bottom:110px; }
  h1,h2,h3,.display{ font-family:'Cinzel','Cormorant Garamond',serif; font-weight:700; letter-spacing:0.1em; }
  .top h1{
    font-size:2rem; line-height:1.15; letter-spacing:0.14em; text-transform:uppercase;
    background:linear-gradient(180deg,#f9e2cc 0%,#d9a083 48%,#8a4a4a 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,200,140,.28));
  }
  .top p{ letter-spacing:0.08em; color:#cdb8b4; }
  .card, .modal{
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,227,163,.05);
    border-radius:10px;
  }
  .btn-gold{
    background:linear-gradient(135deg,#f1cd93 0%,#c99a5a 55%,#a3824d 100%); color:#1f1408;
    box-shadow:0 0 22px rgba(237,188,122,.22); letter-spacing:.04em;
  }
  .btn-gold:hover{ background:linear-gradient(135deg,#ffe0a8 0%,#d8a964 55%,#b08c55 100%); box-shadow:0 0 30px rgba(237,188,122,.4); }
  .btn-outline{ border-color:rgba(210,164,101,.45); }
  .brand-bar img{ filter:drop-shadow(0 0 22px rgba(237,188,122,.38)); }
  input[type=text],input[type=password],input[type=tel],textarea{ background:rgba(18,10,20,.55); }
  @media (prefers-reduced-motion: reduce){ #dust{ display:none; } }
  /* ---- Ajustes UX/UI (revisión) ---- */
  .toggle-row .btn{ margin-top:0; background:transparent; color:var(--text); border:1px solid var(--border); }
  .toggle-row .btn:disabled{ opacity:.4; }
  .toggle-row .btn.active{ background:linear-gradient(135deg,#f1cd93 0%,#c99a5a 55%,#a3824d 100%); color:#1f1408; border-color:transparent; box-shadow:0 0 20px rgba(237,188,122,.25); }
  .wide .counter .big{ font-size:clamp(4.5rem,11vw,9rem); }
  .wide .counter .sub{ font-size:1.3rem; letter-spacing:.06em; }
  .wide .spectator-grid{ gap:22px; margin-top:22px; }
  .wide .spec-item .sname{ font-size:1.05rem; margin-top:8px; color:var(--text); }
  .wide .spec-item img{ border-radius:14px; }
  @media (min-width:700px){ body.spec #app{ max-width:1100px; } }


  /* ---- Panel de analítica ---- */
  .fun-row{ margin-bottom:12px; }
  .fun-head{ display:flex; justify-content:space-between; font-size:.95rem; margin-bottom:4px; }
  .fun-head strong{ color:var(--gold); font-size:1.15rem; }
  .fun-bar{ height:12px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; }
  .fun-fill{ height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold)); border-radius:6px; }
  .fun-fill.ok{ background:linear-gradient(90deg,#6aa37a,#9bd1a8); }
  .fun-note{ font-size:.8rem; color:var(--text-dim); margin-top:3px; }
  .fun-split{ display:grid; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:.95rem; }
  .fun-split strong{ color:var(--gold); }
  .fun-split .hint-inline{ display:block; font-size:.8rem; color:var(--text-dim); margin-top:2px; }
  .part{ border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:rgba(255,255,255,.03); }
  .part-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; }
  .part-org{ font-weight:600; color:var(--text); }
  .part-sub{ font-size:.78rem; color:var(--text-dim); margin-top:2px; }
  .part-head .tag-pill{ white-space:nowrap; flex:0 0 auto; }
  .part.open{ border-color:var(--gold-dim); }
  .part-body{ padding:0 12px 12px; }
  .part-facts{ display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; font-size:.85rem; padding:10px 0; border-top:1px solid var(--border); }
  .part-facts span{ display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); }
  .part-players{ display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:10px; }
  .part-player{ text-align:center; font-size:.78rem; line-height:1.2; }
  .part-player img{ width:56px; height:56px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 4px; border:1px solid var(--gold-dim); }
  .part-player.dead img{ filter:grayscale(1); opacity:.55; }
  .part-player.dead div{ opacity:.6; text-decoration:line-through; }
  .tbl-wrap{ overflow-x:auto; margin-top:12px; }
  .tbl{ width:100%; border-collapse:collapse; font-size:.85rem; min-width:620px; }
  .tbl th{ text-align:left; color:var(--gold); font-weight:600; padding:8px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .tbl td{ padding:8px 8px; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:top; }
  details.card summary{ list-style:none; }
  details.card summary::-webkit-details-marker{ display:none; }
</style>
</head>
<body>
<svg id="flora" viewBox="0 0 760 170" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a8f6a"/><stop offset="1" stop-color="#2d4a3a"/></linearGradient>

// ---------- sonidos (sintetizados, sin ficheros externos) ----------
function playTone(freq, duration, type, vol){
  try{
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext||window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.value = vol || 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }catch(e){ /* audio no disponible, seguimos sin sonido */ }
}
function sfxKill(){ playTone(180,0.15,'square',0.2); setTimeout(()=>playTone(120,0.15,'square',0.2),90); }
function sfxReassign(){ playTone(300,0.12,'sine',0.15); setTimeout(()=>playTone(220,0.12,'sine',0.15),100); setTimeout(()=>playTone(500,0.18,'sine',0.15),200); }
function sfxFanfare(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,0.28,'triangle',0.18), i*140)); }
function sfxNotify(){ playTone(660,0.12,'sine',0.15); setTimeout(()=>playTone(880,0.12,'sine',0.15),120); }

// ---------- utilidades ----------
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)); }
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function derangement(ids){
  if(ids.length<2) return ids.slice();
  let perm, tries=0;
  do{
    perm = shuffle(ids);
    tries++;
    if(tries>500) break;
  } while(perm.some((v,i)=>v===ids[i]));
  return perm;
}
function resizeImage(file, maxSize=480){
  // Calidad alta pero acotada: Google Sheets no admite más de 50.000 caracteres por celda,
  // así que se comprime de forma adaptativa hasta quedar por debajo de ese límite con margen.
  const LIMIT = 45000;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let size = maxSize, quality = 0.85, out = null;
        for(let i=0;i<12;i++){
          let w=img.width, h=img.height;
          if(w>h){ if(w>size){ h=Math.round(h*size/w); w=size; } }
          else { if(h>size){ w=Math.round(w*size/h); h=size; } }
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img,0,0,w,h);
          out = canvas.toDataURL('image/jpeg',quality);
          if(out.length <= LIMIT) break;
          if(quality > 0.62) quality -= 0.08; else size = Math.round(size*0.85);
        }
        resolve(out);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function loadGame(code){
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?code=${encodeURIComponent(code)}&key=${encodeURIComponent(CONFIG.SECRET_KEY)}`;
    const res = await fetch(url);
    const json = await res.json();
    if(json.error){ console.error('Error backend:', json.error); return null; }
    return json.found ? JSON.parse(json.data) : null;
  }catch(e){ console.error(e); return undefined; } // undefined = fallo de conexión, distinto de "no existe" (null)
}
async function ensurePhotos(g){
  if(!g || !g.jugadores) return;
  state.photoCache = state.photoCache || {};
  const missing = g.jugadores.map(j=>j.id).filter(id=>!(id in state.photoCache));
  if(missing.length===0) return;
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=fotos&code=${encodeURIComponent(state.code)}&ids=${encodeURIComponent(missing.join(','))}&key=${encodeURIComponent(CONFIG.SECRET_KEY)}`;
    const res = await fetch(url);
    const json = await res.json();
    if(json.fotos){ Object.assign(state.photoCache, json.fotos); render(); }
  }catch(e){ console.error(e); }
}
function photoOf(id){ return (state.photoCache && state.photoCache[id]) || null; }
async function saveGame(code, obj){
  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita el preflight CORS que Apps Script no soporta
      body: JSON.stringify({ key: CONFIG.SECRET_KEY, code, data: JSON.stringify(obj) })
    });
    const json = await res.json();
    return !!json.ok;
  }catch(e){ console.error(e); return false; }
}
async function callAction(action, payload){
  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ key: CONFIG.SECRET_KEY, action }, payload))
    });
    const json = await res.json();
    if(json.error) return { ok:false, error: json.error };
    return { ok:true, data: json.data ? JSON.parse(json.data) : null, jugadorId: json.jugadorId, esAdmin: json.esAdmin, pin: json.pin };
  }catch(e){ console.error(e); return { ok:false, error:'red' }; }
}

// ---------- transiciones de estado tras poll ----------
function checkNuevasSolicitudes(g){
  const soyOrganizador = state.role==='admin' || (state.role==='player' && g.jugadores.some(j=>j.id===state.myPlayerId && j.esAdmin));
  if(!soyOrganizador) return;
  const pendientes = (g.solicitudesCambio||[]).filter(s=>s.estado==='pendiente');
  state._solicitudesVistas = state._solicitudesVistas || {};
  const nuevas = pendientes.filter(s => !state._solicitudesVistas[s.jugadorId+':'+s.ts]);
  if(nuevas.length){
    nuevas.forEach(s => state._solicitudesVistas[s.jugadorId+':'+s.ts] = true);
    sfxNotify();
  }
}

async function pollTick(){
  if(!state.code) return;
  if(state.screen==='join' || state.screen==='tutorial' || state.screen==='created' || state.showKillModal || state.showAccionesModal) return; // no interrumpir mientras el usuario está escribiendo, leyendo el tutorial, o viendo el código para compartir
  const g = await loadGame(state.code);
  if(!g) return;
  state._game = g;
  checkNuevasSolicitudes(g);
  ensurePhotos(g);
  if(state.role==='player'){
    const me = g.jugadores.find(j=>j.id===state.myPlayerId);
    if(me){
      if(g.estado==='finalizada'){
        if(state.screen!=='ranking') sfxFanfare();
        state.screen='ranking';
        if(state.pollTimer) clearInterval(state.pollTimer);
      }
      else if(me.estado==='muerto'){ if(state.screen!=='dead') state.screen='dead'; }
      else if(g.estado==='en_curso' && state.screen==='lobby'){ state.screen='game'; }
      else if(g.estado==='en_curso' && g.ultimaReasignacion && g.ultimaReasignacion!==state.lastReassignSeen){
        state.lastReassignSeen = g.ultimaReasignacion;
        if(state.screen==='game'){ state.showReassignModal = true; sfxReassign(); }
      }
    }
  } else if(state.role==='admin'){
    if(g.estado==='finalizada'){
      if(state.screen!=='ranking') sfxFanfare();
      state.screen='ranking';

async function actionCreateGame(participa, modoEspectador, tipoEvento, modoVisibilidad){
  let adminNombre = null, adminPin = null;
  if(participa===false){
    adminNombre = document.getElementById('cfg-admin-nombre').value.trim();
    adminPin = document.getElementById('cfg-admin-pin').value.trim();
    if(!adminNombre || !/^\d{4}$/.test(adminPin)){
      state.error='Pon tu nombre y un PIN de 4 números para poder recuperar el panel si sales por error.';
      render(); return;
    }
  }
  const accionesOrganizador = (state.cfgAcciones||'').split('\n')
    .map(a=>limpiaAccion(a)).filter(Boolean)
    .filter((a,i,arr)=>arr.indexOf(a)===i).slice(0,60);
  let code = genCode();
  for(let i=0;i<5;i++){
    const existente = await loadGame(code);
    if(!existente) break;
    code = genCode();
  }
  const g = {
    code, estado:'inscripcion', adminParticipa: participa, modoEspectador: modoEspectador || 'anon',
    modoVisibilidadObjetivo: modoVisibilidad || 'visible',
    organizadorNombre: adminNombre, organizadorPin: adminPin,
    accionesOrganizador: accionesOrganizador,
    tipoEvento: tipoEvento || null, creadorDeviceId: getDeviceId(),
    creadoEn: Date.now(), iniciadoEn:null, jugadores: [], ultimaReasignacion:null, aperturasInscripcion:0
  };
  const ok = await saveGame(code, g);
  if(!ok){ state.error='No se ha podido crear la partida. Revisa tu conexión e inténtalo de nuevo.'; render(); return; }
  state.code = code;
  state.adminParticipaFlag = participa;
  state.error = null;
  state._game = g;
  state.role = participa ? 'player' : 'admin';
  if(participa) state._pendingAdminJoin = true;
  else saveSession();
  state.screen = 'created';
  startPolling();
  render();
}

// Las acciones continúan la frase «Matarás a tu objetivo si consigues que…» (ej: «te cuente su destino soñado»)
function limpiaAccion(t){
  let s = String(t||'').trim().replace(/\s+/g,' ');
  s = s.replace(/^(matar[áa]s a tu objetivo si consigues que|consigue que( tu objetivo)?)\s*:?\s*/i,'');
  s = s.replace(/^que\s+/i,'');
  s = s.replace(/[.!\s]+$/,'');
  const w = s.split(' ')[0];
  if(/^[A-ZÁÉÍÓÚÑ][a-záéíóúñü]+$/.test(w) && w.length>1) s = s[0].toLowerCase()+s.slice(1);
  return s.slice(0,120);
}
function avisoAccion(s){
  const p = (s.split(' ')[0]||'').toLowerCase();
  if(/^[a-záéíóúñü]+(ar|er|ir)(se|me|te|lo|la|le|nos)?$/.test(p))
    return 'Parece que empiezas con un verbo en infinitivo («'+p+'…»). La frase es «Matarás a tu objetivo si consigues que…», así que escribe el verbo conjugado: «friegue un vaso», «baile la Macarena», «hable con acento italiano».';
  if(/(^|[\s,¿])(me|mi|mis|conmigo)(?=[\s,?!.]|$)/i.test(s))
    return 'Tu acción la leerá otra persona, así que evita «me», «mi» y «conmigo». Para hablar de quien la use, di «te» o «contigo» (o no lo menciones). Ej: «te ayude con la maleta», «se bañe en la piscina».';
  const pn = p.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(/^(pon|da|di|trae|haz|pasa|sirve|deja|ayuda|acerca|ensena|cuenta|presta|compra|invita|abre|lleva|sujeta|coge)(me|nos)$/.test(pn))
    return 'Eso suena a algo que dice quien escribe («'+p+'…»). Describe lo que tiene que hacer tu objetivo: «te ponga una copa», «se tome un chupito».';
  if(/^(un|una|unos|unas|el|la|los|las)$/.test(p))
    return 'Falta el verbo: la frase es «Matarás a tu objetivo si consigues que…». Ej: «te dé un pico», «te haga un masaje en la espalda».';
  if(/\?/.test(s))
    return 'Escribe lo que tiene que hacer tu objetivo, no una pregunta. Ej: «te sujete el vaso».';
  return null;
}

async function actionSubmitJoin(){
  const nombre = document.getElementById('j-nombre').value.trim();
  const accion = limpiaAccion(document.getElementById('j-accion').value);
  const pin = document.getElementById('j-pin').value.trim();
  if(!nombre || !accion || !/^\d{4}$/.test(pin)){
    state.error='Rellena nombre, acción, y un PIN de exactamente 4 números.';
    render(); return;
  }
  const aviso = avisoAccion(accion);
  if(aviso && state._accionAvisada !== accion){
    state._accionAvisada = accion;
    state.error = aviso + ' (Si prefieres dejarla tal cual, pulsa «Entrar en la partida» otra vez.)';
    const pinVal = document.getElementById('j-pin').value;
    render();
    const n=document.getElementById('j-nombre'); if(n) n.value=nombre;
    const ac=document.getElementById('j-accion'); if(ac) ac.value=accion;
    const pi=document.getElementById('j-pin'); if(pi) pi.value=pinVal;
    return;
  }
  state.error=null;
  state.joining=true;
  render();
  const jugador = {
    id: uid(), nombre, foto: state.photoData || null, accion, pin,
    objetivoId:null, accionAsignada:null, estado:'vivo', numVictimas:0,
    ordenEliminacion:null, tsPrimeraMuerte:null, esAdmin: !!state._pendingAdminJoin, victimasLog:[],
    deviceId: getDeviceId()
  };
  const result = await saveJoin(state.code, jugador);
  state.joining=false;
  if(!result.ok){
    if(result.error==='no existe la partida') state.error='Esta partida ya no existe. Vuelve atrás y prueba con otro código.';
    else if(result.error==='partida ya iniciada') state.error='Esta partida ya ha empezado, no admite más jugadores.';
    else state.error='No se ha podido guardar. Revisa tu conexión e inténtalo de nuevo.';
    render(); return;
  }
  saveProfile({ nombre, foto: state.photoData || null });
  state._game = result.data;
  state.myPlayerId = result.jugadorId || jugador.id;
  state.error=null;
  saveSession();
  state.screen='lobby';
  render();
  ensurePhotos(result.data);
  pollTick();
}

function accionesAbrir(){
  const g = state._game || {};
  let lista = (g.accionesOrganizador || []).slice();
  state._accPrecargada = false;
  if(!lista.length){
    // Sin lista propia: se precarga con las propuestas de los jugadores para poder editarlas/borrarlas
    (g.jugadores||[]).forEach(j=>{
      const a = (j.accion||'').trim().slice(0,120);
      if(a && !lista.includes(a) && lista.length<60) lista.push(a);
    });
    state._accPrecargada = lista.length>0;

  state._accDraft = lista;

}

function accionesAnadir(){
  const el = document.getElementById('acc-nueva');

  if(!v) return;
  if(state._accDraft.includes(v)){ state._accError = 'Esa acción ya está en la lista.'; render(); return; }
  if(state._accDraft.length>=60){ state._accError = 'Máximo 60 acciones.'; render(); return; }
  state._accDraft.push(v); state._accError = null; render(); accionesAutoGrow();
  setTimeout(()=>{ const n=document.getElementById('acc-nueva'); if(n) n.focus(); },30);
}
function accionesBorrar(i){ state._accDraft.splice(i,1); state._accError = null; render(); accionesAutoGrow(); }
function accionesImportar(){
  const g = state._game; if(!g) return;

    const a = (j.accion||'').trim().slice(0,120);

function formatElapsed(ms){
  if(!ms || ms<0) ms=0;
  const totalMin = Math.floor(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  return (h>0? h+'h ':'') + m+'min';
}

function avatarSrc(foto){ return foto || 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b2552"/><stop offset="1" stop-color="#1c0f22"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><circle cx="100" cy="78" r="34" fill="#8a6a8f" opacity=".75"/><path d="M34 200 C34 140 70 120 100 120 C130 120 166 140 166 200Z" fill="#8a6a8f" opacity=".75"/></svg>'); }
function codePillHtml(){
  return `<div class="code-pill" onclick="state.showCodeQr=true; render();"><span class="txt">Partida: ${esc(state.code)}</span><span class="hint-inline">Toca para ver el QR</span></div>`;
}
function codeQrModalHtml(){
  if(!state.showCodeQr) return '';
  const url = shareUrlFor(state.code);
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(url);
  return `
    <div class="modal-bg" onclick="state.showCodeQr=false; render();">
      <div class="modal center" onclick="event.stopPropagation();">
        <h3 style="margin-bottom:10px;">Escanea para unirte</h3>
        <div class="code-box" style="margin-bottom:14px;">${esc(state.code)}</div>
        <img class="qr" src="${qrUrl}" width="240" height="240" alt="QR de la partida">
        <button class="btn btn-outline" style="margin-top:14px;" onclick="copyLink('${url}')">Copiar enlace</button>
        <button class="btn btn-gold" style="margin-top:8px;" onclick="state.showCodeQr=false; render();">Cerrar</button>
      </div>
    </div>`;
}

function render(){
  document.body.classList.toggle('wide', state.screen==='spectator' || state.screen==='admin-panel' || state.screen==='panel');
  document.body.classList.toggle('spec', state.screen==='spectator');
  const renderKey = state.screen + ':' + (state.rankingSlide||0);
  const cambioDeVista = state._lastRenderKey !== renderKey;
  state._lastRenderKey = renderKey;
  const app = document.getElementById('app');
  let html = '';

  if(state.screen==='home'){
    html = `
      <div class="top"><h1>LOS JUEGOS DEL AMARULER</h1><p>Un objetivo. Una misión. Un superviviente.</p></div>
      <div class="card">
        <p class="hint">Recuerda: consigue que sea tu objetivo quien haga la acción asignada — nunca al revés.</p>
        <button class="btn btn-gold" onclick="renderCreateConfig()">Crear partida</button>
        <label>¿Ya tienes un código?</label>
        <input type="text" id="join-code-input" placeholder="Código de partida" maxlength="5">
        <button class="btn btn-outline" onclick="actionGoJoinExisting()">Unirme a la partida</button>
        ${state.error? `<div class="err">${esc(state.error)}</div>`:''}
      </div>
      <div class="card">
        <label>Ver el marcador en directo</label>
        <input type="text" id="spec-code-input" placeholder="Código de partida" maxlength="5">
        <button class="btn btn-outline" onclick="actionOpenSpectator()">Abrir modo espectador</button>
      </div>
      <div class="footer-nav">
        <a onclick="state.screen='recover'; state.error=null; render();">¿Perdiste el acceso a tu partida o a tu panel? Recupéralo aquí</a>
      </div>`;
  }

  else if(state.screen==='recover'){
    html = `
      <div class="top"><h1>RECUPERAR ACCESO</h1></div>
      <div class="card">
        <p class="hint">Introduce los mismos datos que pusiste — vale tanto si eras jugador como si eras el organizador.</p>
        <label>Código de partida</label>
        <input type="text" id="rec-code" placeholder="Código de partida" maxlength="5">
        <label>Tu nombre</label>
        <input type="text" id="rec-nombre" placeholder="El mismo nombre que pusiste">
        <label>Tu PIN</label>
        <input type="tel" id="rec-pin" maxlength="4" placeholder="0000">
        ${state.error? `<div class="err">${esc(state.error)}</div>`:''}
        <button class="btn btn-gold" ${state.recovering?'disabled':''} onclick="actionRecoverSubmit()">${state.recovering?'Buscando…':'Recuperar'}</button>
      </div>
      <div class="footer-nav"><a onclick="goHome()">← Volver</a></div>`;
  }

  else if(state.screen==='create-config'){
    const p = state.cfgParticipa;
    const m = state.cfgModoEspectador;
    html = `
      <div class="top"><h1>NUEVA PARTIDA</h1></div>
      <div class="card">
        <h2 style="font-size:1.6rem; color:var(--gold); margin-bottom:10px;">¿Vas a jugar tú también?</h2>
        <div class="row">
          <button class="btn ${p===true?'btn-gold':'btn-outline'}" style="padding:20px 16px; font-size:1.1rem;" onclick="state.cfgParticipa=true; render();">🗡️ Sí, quiero jugar</button>
          <button class="btn ${p===false?'btn-gold':'btn-outline'}" style="padding:20px 16px; font-size:1.1rem;" onclick="state.cfgParticipa=false; render();">📋 No, solo organizo</button>
        </div>
        <p class="hint">Si juegas, no podrás ver el panel general en directo — jugarás a ciegas como el resto. Como organizador, tú siempre puedes ver todo desde tu panel, elijas lo que elijas abajo.</p>
      </div>
      <div class="card">
        <p style="font-size:0.95rem;">¿Qué pueden ver los <strong>jugadores</strong> en el marcador público (el que se puede proyectar en una pantalla)?</p>
        <div class="row">
          <button class="btn ${m==='nada'?'btn-gold':'btn-outline'}" style="font-size:0.85rem;" onclick="state.cfgModoEspectador='nada'; render();">🔒 Nada</button>
          <button class="btn ${m==='anon'?'btn-gold':'btn-outline'}" style="font-size:0.85rem;" onclick="state.cfgModoEspectador='anon'; render();">🔢 Solo un contador</button>
          <button class="btn ${m==='completo'?'btn-gold':'btn-outline'}" style="font-size:0.85rem;" onclick="state.cfgModoEspectador='completo'; render();">🖼️ Caras y nombres</button>
        </div>
        <p class="hint">
          <strong>Nada:</strong> el marcador público queda desactivado, nadie ve nada fuera de su propio móvil.<br>
          <strong>Solo un contador:</strong> se ve cuántos quedan vivos ("3 de 12"), sin decir quiénes.<br>
          <strong>Caras y nombres:</strong> se ve quién sigue vivo y quién ha caído, pero nunca quién persigue a quién.
        </p>
        <p class="hint">Esto es independiente de ti como organizador: puedes cambiarlo en cualquier momento desde tu panel.</p>
      </div>
      <div class="card">
        <p style="font-size:0.95rem;">¿Cómo se muestra el objetivo en la pantalla de cada jugador?</p>
        <div class="row">
          <button class="btn ${state.cfgVisibilidad==='visible'?'btn-gold':'btn-outline'}" onclick="state.cfgVisibilidad='visible'; render();">Siempre visible</button>
          <button class="btn ${state.cfgVisibilidad==='oculto'?'btn-gold':'btn-outline'}" onclick="state.cfgVisibilidad='oculto'; render();">Oculto (privacidad)</button>
        </div>
        <p class="hint">
          <strong>Siempre visible:</strong> la foto y la misión se ven en todo momento en pantalla.<br>
          <strong>Oculto:</strong> la pantalla no muestra nada por defecto; cada jugador pulsa un botón para verlo unos segundos y se oculta solo — ideal para que nadie a tu lado pueda verlo de reojo.
        </p>
      </div>
      <div class="card">
        <p style="font-size:0.95rem;">¿Quieres añadir acciones propias de este evento? <span style="color:var(--text-dim); font-weight:400;">(opcional)</span></p>
        <textarea id="cfg-acciones" placeholder="Una por línea, continuando «Matarás a tu objetivo si consigues que…». Ej:&#10;baile la Macarena&#10;hable con acento italiano&#10;se bañe en la piscina&#10;te cuente su destino favorito" oninput="state.cfgAcciones=this.value">${esc(state.cfgAcciones||'')}</textarea>
        <p class="hint">Se usan cuando un jugador pide cambiar su misión y tú lo apruebas. Cada una continúa la frase «Matarás a tu objetivo si consigues que…». Si lo dejas vacío, el cambio sale de las acciones que propusieron los jugadores.</p>
      </div>
      <div class="card">
        <p style="font-size:0.9rem;">¿Qué tipo de evento es? <span style="color:var(--text-dim); font-weight:400;">(opcional)</span></p>
        <div class="row">
          <button class="btn ${state.cfgTipoEvento==='fiesta'?'btn-gold':'btn-outline'}" style="font-size:0.82rem;" onclick="state.cfgTipoEvento='fiesta'; render();">Fiesta</button>
          <button class="btn ${state.cfgTipoEvento==='empresa'?'btn-gold':'btn-outline'}" style="font-size:0.82rem;" onclick="state.cfgTipoEvento='empresa'; render();">Empresa</button>
          <button class="btn ${state.cfgTipoEvento==='despedida'?'btn-gold':'btn-outline'}" style="font-size:0.82rem;" onclick="state.cfgTipoEvento='despedida'; render();">Despedida</button>
        </div>
      </div>
      ${p===false? `
      <div class="card">
        <p style="font-size:0.95rem;">Tu acceso como organizador</p>
        <p class="hint">Si sales sin querer de la app, esto es lo que necesitarás para volver a tu panel — igual que hacen los jugadores con su nombre y PIN.</p>
        <label>Tu nombre</label>
        <input type="text" id="cfg-admin-nombre" placeholder="Tu nombre (solo para recuperar el panel)">
        <label>Tu PIN (4 números)</label>
        <input type="tel" id="cfg-admin-pin" maxlength="4" placeholder="0000">
      </div>` : ''}
      <div class="card center">
        <button class="btn btn-gold" ${(p===undefined||!m||!state.cfgVisibilidad)?'disabled':''} onclick="actionCreateGame(state.cfgParticipa, state.cfgModoEspectador, state.cfgTipoEvento, state.cfgVisibilidad)">Crear partida</button>
      </div>
      <div class="footer-nav"><a onclick="goHome()">← Volver</a></div>`;
  }

  else if(state.screen==='created'){
    const url = shareUrlFor(state.code);
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    const waUrl = 'https://wa.me/?text=' + encodeURIComponent('🎭 Únete a la partida de Los Juegos del Amaruler, un juego para pasarlo bien y conocernos entre todos: ' + url);
    html = `
      <div class="top"><h1>PARTIDA CREADA</h1></div>
      <div class="card center">
        <div class="code-box">${state.code}</div>
        <img class="qr" src="${qrUrl}" width="220" height="220" alt="QR de la partida">
        <p class="small-link">${esc(url)}</p>
        <p class="hint">Comparte el código, el QR o el enlace para que se unan desde su móvil.</p>
        <div class="row">
          <button class="btn btn-outline" onclick="copyLink('${url}')">Copiar enlace</button>
          <a class="btn btn-outline" href="${waUrl}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
        ${state.adminParticipaFlag ? '' : `<p class="hint">Si sales sin querer del panel, podrás volver con tu nombre y PIN desde "¿Perdiste el acceso...? Recupéralo aquí" en la pantalla de inicio.</p>`}
        <button class="btn btn-gold" onclick="${state.adminParticipaFlag ? 'goToJoin()' : "state.screen='lobby'; render(); pollTick();"}">${state.adminParticipaFlag? 'Continuar y crear tu perfil' : 'Ir a la sala de espera'}</button>
      </div>
      <div class="footer-nav"><a onclick="goHome()">← Cancelar</a></div>`;
  }

  else if(state.screen==='tutorial'){
    const step = state.tutorialStep||0;
    const pasos = [
      { titulo:'¿CÓMO FUNCIONA?', texto:'Vas a recibir un objetivo: otra persona de la partida. Tu misión es conseguir que ESA PERSONA haga, sin sospechar, una acción secreta que tú le asignarás. Y lo importante de verdad: que habléis, os mováis y os conozcáis entre todos, incluso entre desconocidos. Da igual ganar o perder.' },
      { titulo:'CUANDO LO CONSIGUES', texto:'En cuanto tu objetivo hace la acción, queda eliminado. Heredas automáticamente a quién estaba cazando él y con qué acción — y sigues cazando. Al final solo queda un superviviente.' },
      { titulo:'ELIGE BIEN TU ACCIÓN', texto:'Tu acción no volverá necesariamente a ti — se reparte al azar entre todos, y puede tocarle a cualquiera para usarla sobre cualquier objetivo. Por eso cuanto más realista y fácil de pedir sin levantar sospechas sea, más divertida será para todo el grupo. Escríbela siempre dirigida a quien la use, completando la frase «Matarás a tu objetivo si consigues que…» (ej: «baile la Macarena», «hable con acento italiano», «te cuente su destino soñado»).' }
    ];
    const p = pasos[step];
    html = `
      <div class="top"><h1>ANTES DE EMPEZAR</h1></div>
      <div class="card center slide-enter">
        <h2 style="color:var(--gold); font-size:1.6rem; margin-bottom:10px;">${p.titulo}</h2>
        <p class="hint" style="font-size:1rem; line-height:1.5;">${p.texto}</p>
      </div>
      <div class="step-indicator">Paso ${step+1} de 3</div>
      <div class="slide-nav">
        ${step>0? `<button class="btn btn-outline" onclick="tutorialNav(-1)">← Anterior</button>`:''}
        ${step<2? `<button class="btn btn-gold" onclick="tutorialNav(1)">Siguiente →</button>` : `<button class="btn btn-gold" onclick="finishTutorial()">Entendido, ¡vamos!</button>`}
      </div>
      <div class="footer-nav"><a onclick="goHome()">← Cancelar</a></div>`;
  }

  else if(state.screen==='join'){
    const profile = loadProfile();
    html = `
      <div class="top"><h1>ÚNETE</h1><p>Partida ${esc(state.code)} · <a onclick="state.tutorialStep=0; state.screen='tutorial'; render();" style="color:var(--gold); cursor:pointer; text-decoration:underline;">¿Cómo se juega?</a></p></div>
      <div class="card">
        <div class="avatar-wrap"><img id="photo-preview" class="avatar" src="${avatarSrc(state.photoData)}"></div>
        <label>Tu rostro para la arena</label>
        <input type="file" id="file-camera" accept="image/*" capture="user" style="display:none" onchange="handlePhotoInput(this)">
        <input type="file" id="file-gallery" accept="image/*" style="display:none" onchange="handlePhotoInput(this)">
        <div class="row">
          <button type="button" class="btn photo-btn" onclick="document.getElementById('file-camera').click()">📸 Hacer foto</button>
          <button type="button" class="btn photo-btn" onclick="document.getElementById('file-gallery').click()">🖼️ Desde galería</button>
        </div>
        <p class="hint">Si has abierto este enlace desde WhatsApp y la cámara no responde, pulsa los tres puntos de arriba y elige "Abrir en el navegador", o usa "Desde galería".</p>
        <label>Tu nombre</label>
        <input type="text" id="j-nombre" value="${esc(profile.nombre||'')}" placeholder="Nombre visible para los demás">
        <label>Tu acción para matar <span class="info-icon" onclick="toggleAccionHint()">ⓘ</span></label>
        <p style="margin:2px 0 6px; color:var(--gold); font-weight:600;">Matarás a tu objetivo si consigues que…</p>
        <input type="text" id="j-accion" maxlength="120" placeholder="baile la Macarena">
        <p class="hint">Escribe lo que tiene que hacer tu objetivo, con el verbo conjugado: «baile la Macarena», «hable con acento italiano», «se bañe en la piscina». Si tiene que ver con quien lo mata, usa «te» o «contigo»: «te cuente su destino soñado».</p>
        ${state.showAccionHint? `<p class="hint">✔ <em>baile la Macarena</em> · <em>hable con acento italiano</em> · <em>se bañe en la piscina</em> · <em>te cuente un secreto</em> · <em>se haga una foto contigo</em><br>✘ «Fregar un vaso» (mejor: «friegue un vaso») · «Ponme una copa» (habla quien escribe) · «Que me deje una camiseta» (no uses me/mi/conmigo: la leerá otra persona)<br>Cuanto más fácil de pedir sin levantar sospechas y más divertida, ¡mejor será el juego!</p>` : ''}
        <label>Tu PIN secreto (4 números)</label>
        <input type="tel" id="j-pin" maxlength="4" placeholder="0000">
        <p class="hint">Dale este PIN solo a quien consiga matarte, en el momento en que lo logre.</p>
        ${state.error? `<div class="err">${esc(state.error)}</div>`:''}
        ${state.joining? `<p class="hint center" style="color:var(--gold);">Guardando tu perfil, puede tardar unos segundos con mala cobertura — no vuelvas a pulsar.</p>` : ''}
        <button class="btn btn-gold" ${state.joining?'disabled':''} onclick="actionSubmitJoin()">${state.joining?'Guardando…':'Entrar en la partida'}</button>
      </div>
      <div class="footer-nav"><a onclick="goHome()">← Probar con otro código</a></div>`;
  }

  else if(state.screen==='lobby'){
    const g = state._game;
    const jugadores = g ? g.jugadores : [];
    const misDatos = jugadores.find(j=>j.id===state.myPlayerId);
    const puedeIniciar = state.role==='admin' || (misDatos && misDatos.esAdmin);
    html = `
      ${codePillHtml()}
      <div class="top"><h1>SALA DE ESPERA</h1><p>Partida ${esc(state.code)} · ${jugadores.length} unidos</p></div>
      <div class="card">
        <div class="lobby-grid">
          ${jugadores.map(j=>`
            <div class="lobby-item">
              <img src="${avatarSrc(photoOf(j.id))}">
              <div class="lname">${esc(j.nombre)}</div>
              ${puedeIniciar? `<a onclick="actionEliminarJugador('${j.id}','${esc(j.nombre)}')" style="color:var(--blood); font-size:0.75rem; cursor:pointer; text-decoration:underline; display:inline-block; padding:4px 6px;">Eliminar</a>` : ''}
            </div>`).join('')}
        </div>
        ${jugadores.length===0? '<p class="hint center">Aún no se ha unido nadie.</p>':''}
      </div>
      ${puedeIniciar? `
        <div class="card">
          <div class="row">
            <button class="btn btn-outline" onclick="copyLink('${shareUrlFor(state.code)}')">Copiar enlace</button>
            <a class="btn btn-outline" href="https://wa.me/?text=${encodeURIComponent('🎭 Únete a la partida de Los Juegos del Amaruler, un juego para pasarlo bien y conocernos entre todos: '+shareUrlFor(state.code))}" target="_blank" rel="noopener">WhatsApp</a>
          </div>
          <button class="btn btn-gold" ${jugadores.length<4?'disabled':''} onclick="actionStartGame()">Iniciar partida</button>
          <p class="hint">Se necesitan al menos 4 jugadores.</p>
          ${state.error? `<div class="err">${esc(state.error)}</div>`:''}
        </div>` : `<p class="hint center">Esperando a que el organizador inicie la partida…</p>`}
      <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
  }

  else if(state.screen==='game'){
    const g = state._game;
    const me = g.jugadores.find(j=>j.id===state.myPlayerId);
    const target = me ? g.jugadores.find(j=>j.id===me.objetivoId) : null;
    if(!me || !target){
      html = `<div class="top"><h1>UN MOMENTO…</h1></div><div class="card center"><p class="hint">Actualizando tu misión…</p></div>`;
    } else {
    const vivos = g.jugadores.filter(j=>j.estado==='vivo').length;
    const esObjetivoNuevo = state._lastTargetId !== target.id;
    state._lastTargetId = target.id;
    const modoOculto = g.modoVisibilidadObjetivo==='oculto';
    if(esObjetivoNuevo) state.showTarget = false;
    const mostrarAhora = !modoOculto || state.showTarget;
    const solicitudPendiente = (g.solicitudesCambio||[]).some(s=>s.jugadorId===me.id && s.estado==='pendiente');
    html = `
      ${codePillHtml()}
      <div class="top"><h1>TU MISIÓN</h1><p class="tag">Quedan ${vivos} en juego</p></div>
      <div class="card">
        ${mostrarAhora ? `
          <div class="mission-photo ${esObjetivoNuevo?'reveal':''}"><img src="${avatarSrc(photoOf(target.id))}"></div>
          <div class="name">${esc(target.nombre)}</div>
        ` : `
          <div class="mission-photo placeholder-oculto"><span>?</span></div>
          <div class="name" style="color:var(--text-dim); letter-spacing:0.06em; font-size:1.1rem;">OBJETIVO OCULTO</div>
        `}
        ${modoOculto? `
          <div class="center" style="margin:8px 0 4px;">
            ${mostrarAhora
              ? `<button class="btn btn-outline" onclick="hideTarget()">Ocultar ahora</button>`
              : `<button class="btn btn-gold" onclick="revealTarget()">Ver mi objetivo</button>`}
          </div>` : ''}
        <p class="tag" style="margin-top:14px;">Matarás a tu objetivo si consigues que…</p>
        <div class="mission-box">${esc(me.accionAsignada)}</div>
        <button class="btn btn-blood" onclick="state.showKillModal=true; state.modalError=null; render();">He completado mi misión</button>
        <p class="hint" style="text-align:center; margin-top:10px;">
          ${solicitudPendiente
            ? 'Solicitud enviada — esperando que el organizador la revise.'
            : `¿Misión imposible? <a onclick="actionSolicitarCambio()" style="color:var(--gold); cursor:pointer; text-decoration:underline;">Pedir un cambio</a>`}
        </p>
      </div>
      <div class="card center">
        <p class="hint clickable-hint" onclick="state.showVictimList=!state.showVictimList; render();">Víctimas conseguidas: ${me.numVictimas} ${me.numVictimas>0?(state.showVictimList?'▲':'▼'):''}</p>
        ${state.showVictimList && me.victimasLog && me.victimasLog.length ? `
          <div style="margin-top:8px; text-align:left;">
            ${me.victimasLog.map((v,i)=>`
              <div class="ranking-row">
                <img src="${avatarSrc(photoOf(v.id))}">
                <div class="rn">${i+1}. ${esc(v.nombre)}</div>
                <div class="rv">${formatElapsed((v.ts||0)-(g.iniciadoEn||0))}</div>
              </div>`).join('')}
          </div>` : ''}
        ${state.showMyPin? `<div class="code-box" style="font-size:1.8rem; margin-top:12px;">${esc(me.pin)}</div>` : `<button class="btn btn-outline" onclick="revealMyPin()">¿Olvidaste tu PIN?</button>`}
      </div>
      <div class="footer-nav">
        ${me.esAdmin ? `<a onclick="accionesAbrir()">Acciones de reserva</a> · ` : ''}
        ${me.esAdmin ? `<a onclick="state.showSolicitudesModal=true; render();">Solicitudes de cambio${(g.solicitudesCambio||[]).filter(s=>s.estado==='pendiente').length? ' ('+(g.solicitudesCambio||[]).filter(s=>s.estado==='pendiente').length+')':''}</a> · ` : ''}
        <a onclick="goHome()">Salir</a>
      </div>
    `;
    if(state.showSolicitudesModal){
      const pendientes = (g.solicitudesCambio||[]).filter(s=>s.estado==='pendiente');
      html += `
        <div class="modal-bg">
          <div class="modal">
            <h3 style="margin-bottom:10px;">Solicitudes de cambio de misión</h3>
            ${pendientes.length===0? `<p class="hint">No hay solicitudes pendientes.</p>` : pendientes.map(s=>`
              <div class="ranking-row">
                <div class="rn">${esc(s.nombre)}</div>
                <button class="btn btn-gold" style="flex:none; width:auto; padding:8px 14px;" onclick="actionResolverCambio('${s.jugadorId}', true)">Aprobar</button>
                <button class="btn btn-outline" style="flex:none; width:auto; padding:8px 14px;" onclick="actionResolverCambio('${s.jugadorId}', false)">Rechazar</button>
              </div>
            `).join('')}

      const left = 50 + radius*Math.cos(angle) - 7;
      const top = 50 + radius*Math.sin(angle) - 7;
      const rot = ((i*37)%40)-20;
      return `top:${top}%; left:${left}%; transform:rotate(${rot}deg);`;
    }
    const slide = state.rankingSlide || 0;

    if(slide===0 && superviviente){
      const confetti = Array.from({length:18}).map((_,i)=>{
        const left = Math.round(Math.random()*100);
        const delay = (Math.random()*0.6).toFixed(2);
        const colors = ['#BE8F4E','#8c1f28','#F2F1ED','#8a6a3b'];
        const color = colors[i%colors.length];
        return `<div class="confetti-piece" style="left:${left}%; background:${color}; animation-delay:${delay}s;"></div>`;
      }).join('');
      const bgThumbs = eliminados.map((j,i)=>`<img class="bg-thumb" src="${avatarSrc(photoOf(j.id))}" style="${orbitStyle(i, eliminados.length)}">`).join('');
      html = `
        <div class="top"><h1>ÚLTIMO SUPERVIVIENTE</h1></div>
        <div class="confetti-wrap">${confetti}</div>
        <div class="card center slide-enter">
          <div class="winner-stage">
            <div class="winner-bg">${bgThumbs}</div>
            <div class="winner-photo"><img src="${avatarSrc(photoOf(superviviente.id))}"></div>
          </div>
          <div class="final-label">Ha sobrevivido a los demás</div>
          <div class="final-name">${esc(superviviente.nombre)}</div>
          <p class="epic-copy hint">Todos los que ves alrededor cayeron por el camino.</p>
          <p class="epic-copy hint">Solo queda en pie quien tuvo más cabeza — o más suerte.</p>
        </div>
        <div class="step-indicator">Paso 1 de 4</div>
        <div class="slide-nav"><button class="btn btn-gold" onclick="rankingNav(1)">Siguiente →</button></div>
        <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
    } else if(slide===1 && veloz){
      const minutos = formatElapsed((veloz.tsPrimeraMuerte||0) - (g.iniciadoEn||0));
      html = `
        <div class="top"><h1>ASESINO MÁS VELOZ</h1></div>
        <div class="card center slide-enter">
          <div class="avatar-wrap epic"><img class="avatar" src="${avatarSrc(photoOf(veloz.id))}"></div>
          <div class="final-name" style="font-size:2.1rem;">${esc(veloz.nombre)}</div>
          <div class="final-label" style="margin-top:8px;">Tiempo hasta su primera víctima</div>
          <div class="time-highlight">${minutos}</div>
          <p class="epic-copy hint">Nadie más tuvo tiempo de reaccionar.</p>
        </div>
        <div class="step-indicator">Paso 2 de 4</div>
        <div class="slide-nav">
          <button class="btn btn-outline" onclick="rankingNav(-1)">← Anterior</button>
          <button class="btn btn-gold" onclick="rankingNav(1)">Siguiente →</button>
        </div>
        <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
    } else if(slide===2 && (serie || serieDuo)){
      const protagonistas = serie ? [serie] : serieDuo;
      const esDuo = !!serieDuo;
      const victimThumbs = protagonistas.map(j=>(j.victimasLog||[]).map(v=>`<img class="victim-thumb" src="${avatarSrc(photoOf(v.id))}">`).join('')).join('');
      html = `
        <div class="top"><h1>${esDuo?'ASESINOS EN SERIE':'ASESINO EN SERIE'}</h1></div>
        <div class="card center slide-enter">
          <div class="row" style="justify-content:center; gap:18px;">
            ${protagonistas.map(j=>`
              <div>
                <div class="avatar-wrap epic" style="width:${esDuo?'120px':'210px'};"><img class="avatar" src="${avatarSrc(photoOf(j.id))}"></div>
                <div class="final-name" style="font-size:${esDuo?'1.3rem':'2.1rem'};">${esc(j.nombre)}</div>
              </div>`).join('')}
          </div>
          <p class="epic-copy hint" style="margin-top:14px;">${esDuo? 'A este dúo le gusta demasiado la sangre.' : `<strong style="color:var(--gold);">${serie.numVictimas} víctimas</strong> a su nombre.`}</p>
          <p class="epic-copy hint">Nadie a su alrededor estaba realmente a salvo.</p>
          <div class="victims-grid">${victimThumbs}</div>
        </div>
        <div class="step-indicator">Paso 3 de 4</div>
        <div class="slide-nav">
          <button class="btn btn-outline" onclick="rankingNav(-1)">← Anterior</button>
          <button class="btn btn-gold" onclick="rankingNav(1)">Siguiente →</button>
        </div>
        <div class="footer-nav"><a onclick="goHome()">Salir</a></div>`;
    } else {
      const nombreValorador = (function(){
        if(state.role==='player'){ const me=g.jugadores.find(j=>j.id===state.myPlayerId); return me? me.nombre : 'Jugador'; }
        if(state.role==='spectator') return 'Espectador';
        return 'Organizador';
      })();
      let resumenTexto = '🎭 ¡LA PARTIDA HA TERMINADO! 🎭\n\nEstos son los resultados de nuestra partida de Los Juegos del Amaruler:\n\n';
      if(superviviente) resumenTexto += `🏆 Superviviente: ${superviviente.nombre}\n`;
      if(veloz) resumenTexto += `⚡ Asesino más rápido: ${veloz.nombre}\n`;
      if(serie) resumenTexto += `🔪 Asesino en serie: ${serie.nombre} (${serie.numVictimas} víctimas)\n`;
      else if(serieDuo) resumenTexto += `🔪 Asesinos en serie: ${serieDuo.map(j=>j.nombre).join(' y ')}\n`;
      resumenTexto += '\n📋 Clasificación completa:\n';
      tabla.forEach((j,i)=>{ resumenTexto += `${i+1}. ${j.nombre} - ${j.numVictimas} víctimas\n`; });
      resumenTexto += '\n💜 Lo importante de verdad: hemos hablado, jugado y conocido a gente nueva. Da igual quién haya ganado o perdido.\n\n¿Os apuntáis a la revancha? 😏\nJuega a Los Juegos del Amaruler en: https://www.gotelin.com/juegos';
      state._lastResumenTexto = resumenTexto;
      const waResumenUrl = 'https://wa.me/?text=' + encodeURIComponent(resumenTexto);
      html = `
        <div class="top"><h1>CLASIFICACIÓN FINAL</h1></div>
        <div class="card slide-enter">
          ${tabla.map((j,i)=>{
            const tg = tagsFor(j);
            return `
            <div class="ranking-row">
              <div class="rank-pos">${i+1}</div>
              <img src="${avatarSrc(photoOf(j.id))}">
              <div class="rn">
                ${esc(j.nombre)}
                ${tg.length? `<div class="tag-labels">${tg.map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div>` : ''}
              </div>
              <div class="rv">${j.numVictimas} víctimas</div>
            </div>`;
          }).join('')}
        </div>
        <div class="card center">
          <p class="hint"><strong>Los Juegos del Amaruler</strong> es un juego creado por Roberto González Arranz.</p>
          <p class="hint">El verdadero objetivo era que hablarais, interactuarais y os conocierais entre todos, incluso entre desconocidos. Da igual quién haya ganado o perdido: gracias por jugar.</p>
        </div>
        <div class="card center">
          <p class="hint">¿Quieres guardar este resultado?</p>
          <div class="row">
            <a class="btn btn-outline" href="${waResumenUrl}" target="_blank" rel="noopener">Enviar por WhatsApp</a>
            ${!state.emailSent? `<button class="btn btn-outline" onclick="state.showEmailForm=!state.showEmailForm; render();">Por email</button>` : ''}
          </div>
          ${state.emailSent? `<p class="hint" style="margin-top:8px;">Revisa tu bandeja de entrada — te lo hemos enviado.</p>` : ''}
          ${state.showEmailForm && !state.emailSent ? `
            <div style="margin-top:12px; text-align:left;">
              <input type="text" id="email-input" placeholder="tu@email.com">
              <label style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:0.8rem; color:var(--text-dim);">
                <input type="checkbox" id="marketing-optin" style="width:auto;"> Avísame si sacáis nuevos juegos o mejoras
              </label>
              <button class="btn btn-gold" style="margin-top:8px;" ${state.sendingEmail?'disabled':''} onclick="actionSendEmailSummary()">${state.sendingEmail?'Enviando…':'Enviar'}</button>
            </div>` : ''}
        </div>
        <div class="card center">
          ${state.ratingSubmitted ? `
            <p class="hint">¡Gracias por tu valoración!</p>
          ` : `
            <p class="hint">¿Qué te ha parecido el juego?</p>
            <div class="stars-row">
              ${[1,2,3,4,5].map(n=>`<span class="star-btn ${n<=(state.ratingValue||0)?'filled':''}" onclick="state.ratingValue=${n}; render();">★</span>`).join('')}
            </div>
            <textarea id="rating-comment" placeholder="¿Algo que mejorarías? (opcional)" style="width:100%; min-height:60px; padding:10px; border-radius:5px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:1rem;"></textarea>
            <button class="btn btn-gold" style="margin-top:10px;" ${state.ratingValue? '' : 'disabled'} onclick="actionSubmitRating('${esc(nombreValorador)}')">Enviar valoración</button>
          `}
        </div>
        <div class="card center">
          <p class="hint">¿Jugamos otra?</p>
          <div class="row">
            <button class="btn btn-gold" onclick="renderCreateConfig()">Jugar otra vez</button>
            <button class="btn btn-outline" onclick="goHome()">Salir</button>
          </div>
        </div>
        <div class="step-indicator">Paso 4 de 4</div>
        <div class="slide-nav"><button class="btn btn-outline" onclick="rankingNav(-1)">← Anterior</button></div>`;
    }
  }

  html = brandBarHtml() + html;
  html += codeQrModalHtml();
  app.innerHTML = html;
  if(cambioDeVista){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    requestAnimationFrame(()=> requestAnimationFrame(()=> window.scrollTo(0,0)));
  }
}

async function actionSendEmailSummary(){
  const emailInput = document.getElementById('email-input');
  const email = emailInput ? emailInput.value.trim() : '';
  const marketingOptIn = document.getElementById('marketing-optin') ? document.getElementById('marketing-optin').checked : false;
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert('Introduce un email válido.');
    return;
  }
  state.sendingEmail = true;
  render();
  const result = await callAction('enviarResumen', { code: state.code, email, marketingOptIn, resumenTexto: state._lastResumenTexto || '' });
  state.sendingEmail = false;
  if(!result.ok){
    alert('No se ha podido enviar el email. Inténtalo de nuevo.');
    render();
    return;
  }
  state.showEmailForm = false;
  state.emailSent = true;
  render();
}

async function actionSubmitRating(nombre){
  const comentario = document.getElementById('rating-comment').value.trim();
  state.ratingSubmitted = true; // optimista: si falla el envío no merece la pena bloquear al usuario por esto
  render();
  await callAction('valorar', { code: state.code, nombre, puntuacion: state.ratingValue, comentario });
}

async function loadPanelStats(){
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=estadisticas&key=${encodeURIComponent(CONFIG.SECRET_KEY)}`;
    const res = await fetch(url);
    state._stats = await res.json();
  }catch(e){ state._stats = null; }
}
async function loadPanelDetalle(){
  const pin = state._panelPin;
  if(!pin){ state._detalle = null; return; }
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=detalle&key=${encodeURIComponent(CONFIG.SECRET_KEY)}&pin=${encodeURIComponent(pin)}`;
    const res = await fetch(url);
    const d = await res.json();
    if(d && d.partidas){ state._detalle = d; state._detError = null; }
    else { state._detalle = null; state._detError = 'Código incorrecto.'; state._panelPin = null; try{ localStorage.removeItem('amaruler-panel-pin'); }catch(e){} }
  }catch(e){ state._detalle = null; state._detError = 'No se ha podido conectar.'; }
}
async function unlockDetalle(){
  const el = document.getElementById('panel-pin');
  state._panelPin = el ? el.value.trim() : '';
  state._detOpen = true;
  if(!state._panelPin){ state._detError='Escribe el código.'; render(); return; }
  try{ localStorage.setItem('amaruler-panel-pin', state._panelPin); }catch(e){}
  await loadPanelDetalle();
  render();
}
function enlaceAyuda(x){
  const base = (CONFIG.BASE_URL || (location.origin+location.pathname)).split('?')[0].split('#')[0];
  return base + '?ayuda=' + encodeURIComponent(x.codigo) + '#n=' + encodeURIComponent(x.organizador||'') + '&p=' + encodeURIComponent(x.organizadorPin||'');
}
async function copiarEnlaceAyuda(code, btn){
  const x = state._detalle && state._detalle.partidas.find(p=>p.codigo===code);
  if(!x) return;
  const url = enlaceAyuda(x);
  try{ await navigator.clipboard.writeText(url); if(btn){ const t=btn.textContent; btn.textContent='¡Copiado!'; setTimeout(()=>{ btn.textContent=t; },1800); } }
  catch(e){ window.prompt('Copia este enlace:', url); }
}
// Entrar como organizador desde un enlace de ayuda a distancia. Solo LEE la partida (misma comprobación que "Recuperar acceso");
// no guarda la sesión en este dispositivo para no pisar ninguna otra partida que tenga abierta.
async function ayudaDistancia(code, nombre, pin){
  const result = await callAction('recover', { code, nombre, pin });
  if(!result.ok || !result.esAdmin){
    state.error = result.error==='red' ? 'No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.' : 'El enlace de ayuda no es válido o la partida ya no existe.';
    state.screen = 'home'; render(); return;
  }
  state.code = code; state.role = 'admin'; state.myPlayerId = null;
  state._game = result.data; state.lastReassignSeen = result.data.ultimaReasignacion || null;
  const pantalla = await screenForGameState(result.data, 'admin', null);
  state.screen = pantalla || 'lobby';
  if(state.screen!=='ranking') startPolling();
  render(); ensurePhotos(result.data);
}
function togglSel(code, ev){
  if(ev) ev.stopPropagation();
  state._sel = state._sel || {};
  if(state._sel[code]) delete state._sel[code]; else state._sel[code] = true;
  state._delMsg = null; render();
}
function selSinIniciar(){
  state._sel = {}; state._delMsg = null;
  ((state._detalle && state._detalle.partidas) || []).filter(x=>x.estado==='sin_iniciar').forEach(x=>{ state._sel[x.codigo] = true; });
  render();
}
function selNinguna(){ state._sel = {}; state._delMsg = null; render(); }
async function eliminarPartidas(codigos){
  const det = state._detalle; if(!det || !codigos || !codigos.length || state._delBusy) return;
  const ps = codigos.map(c=>det.partidas.find(x=>x.codigo===c)).filter(Boolean);
  if(!ps.length) return;
  const lineas = ps.map(x=>'• '+(x.organizador||'Sin nombre')+' · '+x.codigo+' · '+estadoPartidaTexto(x)+' · '+x.jugadores+' jugador(es)').join('\n');
  const activas = ps.filter(x=>x.estado==='en_curso' && x.viva);
  let msg = '¿Eliminar '+ps.length+' partida'+(ps.length>1?'s':'')+'?\n\n'+lineas+'\n\nDejarán de contar en las estadísticas y se borrarán las fotos de sus jugadores. Se guarda una copia de los datos (sin fotos) en la pestaña «Papelera» del Google Sheets.';
  if(activas.length) msg += '\n\n⚠️ ATENCIÓN: '+activas.length+' de ellas está(n) EN CURSO con actividad en las últimas 24 h. Sus jugadores perderán la partida.';
  if(!window.confirm(msg)) return;
  state._delBusy = true; state._delMsg = null; render();
  const r = await callAction('eliminarPartidas', { codigos: ps.map(x=>x.codigo), pin: state._panelPin });
  state._delBusy = false;
  if(!r.ok){
    state._delMsg = r.error==='pin' ? 'Código del panel incorrecto.'
      : r.error==='acción desconocida' ? 'El servidor aún no tiene la versión que permite eliminar. Hay que actualizar el Apps Script.'
      : 'No se ha podido eliminar. Comprueba la conexión e inténtalo de nuevo.';
    render(); return;
  }
  state._sel = {}; state._abierta = null;
  state._delMsg = 'Eliminadas: '+ps.length+'. Ya no cuentan en las estadísticas.';
  await loadPanelStats(); await loadPanelDetalle(); render();
}
function togglePartida(code){
  state._abierta = state._abierta===code ? null : code;
  render();
  if(state._abierta) loadPanelFotos(code);
}
async function loadPanelFotos(code){
  const p = state._detalle && state._detalle.partidas.find(x=>x.codigo===code);
  if(!p) return;
  state.photoCache = state.photoCache || {};
  const missing = (p.jugadoresLista||[]).map(j=>j.id).filter(id=>!(id in state.photoCache));
  if(!missing.length) return;
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=fotos&ids=${encodeURIComponent(missing.join(','))}&key=${encodeURIComponent(CONFIG.SECRET_KEY)}`;
    const json = await (await fetch(url)).json();
    if(json.fotos){ missing.forEach(id=>{ state.photoCache[id] = json.fotos[id] || null; }); render(); }
  }catch(e){ console.error(e); }
}
function fmtFechaHora(ms){
  if(!ms) return '—';
  try{
    return new Date(ms).toLocaleString('es-ES', { timeZone:'Europe/Madrid', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return '—'; }
}
function estadoPartidaTexto(x){
  if(x.estado==='completada') return 'Completada';
  if(x.estado==='en_curso') return x.viva? 'En juego ahora' : 'Parada (sin terminar)';
  return x.viva? 'Esperando jugadores' : 'Abandonada (sin iniciar)';
}

function rankingNav(delta){
  state.rankingSlide = Math.max(0, Math.min(3, (state.rankingSlide||0)+delta));
  render();
}

function renderCreateConfig(){ state.screen='create-config'; state.cfgParticipa=undefined; state.cfgModoEspectador=undefined; state.cfgVisibilidad=undefined; render(); }
function actionOpenSpectatorFromInside(){
  state.role='spectator'; state.screen='spectator'; state.myPlayerId=null; render();
}

async function screenForGameState(g, role, myPlayerId){
  if(role==='spectator') return g.estado==='finalizada' ? 'ranking' : 'spectator';
  if(g.estado==='finalizada') return 'ranking';
  if(role==='player'){
    const me = g.jugadores.find(j=>j.id===myPlayerId);
    if(!me) return null;
    if(me.estado==='muerto') return 'dead';
    return g.estado==='en_curso' ? 'game' : 'lobby';
  }
  if(role==='admin'){
    return g.estado==='en_curso' ? 'admin-panel' : 'lobby';
  }
  return null;
}

(async function init(){
  const params = new URLSearchParams(location.search);

  if(params.get('panel')==='1'){
    state.screen = 'panel';
    try{ state._panelPin = localStorage.getItem('amaruler-panel-pin') || null; }catch(e){}
    render();
    await loadPanelStats();
    await loadPanelDetalle();
    render();
    return;
  }

  if(params.get('ayuda')){
    const hp = new URLSearchParams((location.hash||'').replace(/^#/,''));
    const aCode = params.get('ayuda').toUpperCase(), aNombre = hp.get('n')||'', aPin = hp.get('p')||'';
    try{ history.replaceState(null,'',location.pathname); }catch(e){} // quita el PIN de la barra de direcciones
    render();
    await ayudaDistancia(aCode, aNombre, aPin);
    return;
  }

  const espectadorCode = params.get('e') ? params.get('e').toUpperCase() : null;
  const pCode = params.get('p') ? params.get('p').toUpperCase() : null;
  const session = loadSession();

  // Un enlace de espectador en la URL manda siempre sobre cualquier sesión guardada
  if(espectadorCode){
    if(!(session && session.code===espectadorCode)) clearSession();
    state.code = espectadorCode; state.role = 'spectator';
    const g = await loadGame(espectadorCode);
    if(g){ state._game=g; state.screen='spectator'; saveSession(); startPolling(); ensurePhotos(g); }
    else if(g===undefined){ state.error='No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.'; }
    else { state.error='No existe ninguna partida con ese código.'; }
    render();
    return;
  }

  // Un enlace de jugador en la URL manda sobre una sesión de OTRA partida distinta;
  // si coincide con tu sesión actual, se restaura tu identidad completa en esa partida.
  if(pCode){
    if(session && session.code===pCode){
      const g = await loadGame(pCode);
      if(g){
        const pantalla = await screenForGameState(g, session.role, session.myPlayerId);
        if(pantalla){
          state.code=pCode; state.role=session.role; state.myPlayerId=session.myPlayerId;
          state._game=g; state.lastReassignSeen=g.ultimaReasignacion||null; state.screen=pantalla;
          if(pantalla!=='ranking') startPolling();
          render(); ensurePhotos(g);
          return;
        }
      }
      clearSession();
    } else if(session){
      clearSession(); // era la sesión de otra partida distinta: no la mezclamos con esta nueva
    }
    state.code = pCode; state.role = 'player';
    const g = await loadGame(pCode);
    if(g && g.estado==='inscripcion'){
      startPolling();
      goToJoin();
      return;
    }
    else if(g){ state.error='Esta partida ya ha empezado y no admite nuevos jugadores.'; }
    else if(g===undefined){ state.error='No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.'; }
    else { state.error='No existe ninguna partida con ese código.'; }
    render();
    return;
  }

  // Sin ningún código en la URL: restaurar la sesión guardada, la que sea
  if(session && session.code){
    const g = await loadGame(session.code);
    if(g){
      const pantalla = await screenForGameState(g, session.role, session.myPlayerId);
      if(pantalla){
        state.code = session.code; state.role = session.role; state.myPlayerId = session.myPlayerId;
        state._game = g; state.lastReassignSeen = g.ultimaReasignacion || null; state.screen = pantalla;
        if(pantalla!=='ranking') startPolling();
        if(g.estado!=='finalizada') callAction('ping', { code: session.code }); // cuenta como actividad de la partida
        render(); ensurePhotos(g);
        return;
      }
    }
    clearSession();
  }
  render();
})();
</script>
